name: Build Thunder AGI APK (UI-only, no AI models)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove adaptive icon overrides
        run: |
          rm -f lfm25/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          rm -f lfm25/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          echo "Adaptive icon XMLs removed"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Python deps (icon generation only)
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate mipmap icon sizes
        run: |
          python3 << 'PYEOF'
          from PIL import Image
          import os
          src = "lfm25/app/src/main/assets/app_icon_source.jpg"
          if not os.path.exists(src):
              print("WARNING: app_icon_source.jpg not found, skipping icons")
          else:
              sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
              img = Image.open(src).convert("RGBA")
              for name, size in sizes.items():
                  d = f"lfm25/app/src/main/res/mipmap-{name}"
                  os.makedirs(d, exist_ok=True)
                  r = img.resize((size,size), Image.LANCZOS)
                  r.save(f"{d}/ic_launcher.webp","WEBP")
                  r.save(f"{d}/ic_launcher_round.webp","WEBP")
                  print(f"✓ {name} {size}x{size}")
          PYEOF

      - name: Prepare writable Android SDK directory
        run: |
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R $USER:$USER /usr/local/lib/android

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK and CMake
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name "sdkmanager" | head -1)
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x lfm25/gradlew

      - name: Build Release APK
        working-directory: lfm25
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Copy APK to output
        run: |
          mkdir -p output
          APK="lfm25/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="lfm25/app/build/outputs/apk/debug/app-debug.apk"
            echo "Using debug APK"
          fi
          cp "$APK" "output/ThunderAGI-الرعد-ui-only.apk"
          echo "APK size: $(du -sh output/ThunderAGI-الرعد-ui-only.apk)"

      - name: Verify APK
        run: |
          python3 -c "
          import zipfile, sys
          with zipfile.ZipFile('output/ThunderAGI-الرعد-ui-only.apk') as z:
              files = z.namelist()
              onnx = [f for f in files if f.endswith('.onnx')]
              print(f'APK OK: {len(files)} files, ONNX={onnx} (expected empty in this build)')
              if not any(f.endswith('.dex') for f in files):
                  sys.exit(1)
          "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAGI-الرعد-ui-only
          path: output/ThunderAGI-الرعد-ui-only.apk
          retention-days: 30

      - name: Show install instructions
        run: |
          echo "=== HOW TO INSTALL ==="
          echo "1. Download the artifact ZIP from GitHub Actions"
          echo "2. EXTRACT the ZIP — you will find ThunderAGI-الرعد-ui-only.apk inside"
          echo "3. Copy the .apk to your phone and tap to install"
          echo "NOTE: this build has no LLM/VLM model and no ONNX image-gen models bundled."
          echo "      It's for checking the UI/shell only — any AI features will hit"
          echo "      whatever fallback or empty-state path the app has for missing models."
          echo "APK size: $(du -sh output/ThunderAGI-الرعد-ui-only.apk)"
