          def run_model(py, model_path, inputs_npz, out_npz, threads=4, timeout=3 * 3600):
              runner = os.path.join(os.path.dirname(os.path.abspath(out_npz)) or ".", "_ort_runner.py")
              with open(runner, "w") as f:
                  f.write(RUNNER)
              r = subprocess.run([py, runner, model_path, inputs_npz, out_npz, str(threads)], capture_output=True, text=True, timeout=timeout)
              if r.returncode != 0:
                  return False, (r.stderr or r.stdout).strip().splitlines()[-1][:300] if (r.stderr or r.stdout).strip() else "unknown error"
              return True, r.stdout.strip()


          def tok_cos(ref, got, drop=0):
              r = ref[:, drop:, :].reshape(-1, ref.shape[-1]).astype(np.float64)
              g = got[:, drop:, :].reshape(-1, got.shape[-1]).astype(np.float64)
              cs = (r * g).sum(-1) / (np.linalg.norm(r, axis=-1) * np.linalg.norm(g, axis=-1) + 1e-12)
              rel = float(np.linalg.norm(r - g) / (np.linalg.norm(r) + 1e-12))
              return dict(cos_mean=float(cs.mean()), cos_p5=float(np.percentile(cs, 5)), cos_min=float(cs.min()), rel_l2=rel)


          def sample_cos(ref, got):
              cs = [cos_sim(ref[k], got[k]) for k in ref.files if k in got.files]
              rl = [float(np.linalg.norm(ref[k] - got[k]) / (np.linalg.norm(ref[k]) + 1e-12)) for k in ref.files if k in got.files]
              return dict(cos_mean=float(np.mean(cs)), cos_min=float(np.min(cs)), rel_l2=float(np.mean(rl)), n=len(cs))


          def psnr_images(ref, got, peak=2.0):
              ps = []
              for k in ref.files:
                  mse = float(((ref[k].astype(np.float64) - got[k].astype(np.float64)) ** 2).mean())
                  ps.append(99.0 if mse <= 0 else 10 * math.log10(peak * peak / mse))
              return dict(psnr_mean=float(np.mean(ps)), psnr_min=float(np.min(ps)))


          def run_ladder(name, rungs, build, evaluate, accept, out_path, work_dir):
              """Try recipes from smallest to largest; ship the first that builds, loads on ORT 1.17 AND passes the fidelity gate.
              If none passes, the safest candidate that still ran is shipped and flagged (never leave the APK without a model)."""
              results, shipped, runnable = [], None, None
              for tag, recipe in rungs:
                  rec = dict(rung=tag, recipe=recipe)
                  t0 = time.time()
                  cand = os.path.join(work_dir, f"{name}__{''.join(c if c.isalnum() or c in '-_.' else '_' for c in tag)}.onnx")
                  try:
                      model, info = build(recipe)
                      rec["bytes"] = finalize_single_file(model, cand)
                      rec["info"] = info
                      del model; gc.collect()
                      ok, metrics = evaluate(cand)
                      rec["metrics"] = metrics
                      rec["ran_ok"] = bool(ok)
                      rec["accepted"] = bool(ok and accept(metrics))
                  except Exception as e:                       # noqa
                      rec["error"] = f"{type(e).__name__}: {str(e)[:300]}"; rec["accepted"] = False; rec["ran_ok"] = False
                  rec["seconds"] = round(time.time() - t0, 1)
                  results.append(rec)
                  log(f"[{name}] rung {tag}: " + (f"{rec.get('bytes', 0)/1e6:.0f} MB " if "bytes" in rec else "") + f"metrics={rec.get('metrics')} error={rec.get('error')} -> {'ACCEPTED' if rec['accepted'] else 'rejected'}")
                  if rec["accepted"]:
                      os.replace(cand, out_path); shipped = tag; break
                  if rec.get("ran_ok") and os.path.exists(cand):
                      if runnable and os.path.exists(runnable[1]): os.remove(runnable[1])
                      runnable = (tag, cand)                   # keep the most conservative runnable candidate seen so far
                  elif os.path.exists(cand):
                      os.remove(cand)
              if shipped is None and runnable is not None:
                  os.replace(runnable[1], out_path); shipped = runnable[0] + " (GATE NOT PASSED - safest runnable shipped)"
                  log(f"[{name}] WARNING: no rung passed the fidelity gate; shipping {shipped}")
              elif runnable is not None and os.path.exists(runnable[1]):
                  os.remove(runnable[1])
              return shipped, results



          # ───────────────────────────── LM weight sharing across the two encoders ────
          def dedupe_models(paths, out_dir, shared_name="lm_shared.bin", min_bytes=1 << 20):
              """Store every large initializer that is byte-identical across the given single-file models ONCE, in `shared_name`
              (ONNX external-data, 4 KiB aligned).  Lossless.  The app must copy `shared_name` next to the models."""
              from onnx.external_data_helper import set_external_data
              shared_path = os.path.join(out_dir, shared_name)
              index, before, after = {}, 0, 0
              with open(shared_path, "wb") as f:
                  for p in paths:
                      before += os.path.getsize(p)
                      m = onnx.load(p)
                      for t in m.graph.initializer:
                          raw = t.raw_data
                          if len(raw) < min_bytes:
                              continue
                          key = hashlib.sha1(raw).digest() + len(raw).to_bytes(8, "little")
                          if key not in index:
                              f.write(b"\0" * ((-f.tell()) % 4096)); off = f.tell(); f.write(raw); index[key] = (off, len(raw))
                          off, ln = index[key]
                          set_external_data(t, location=shared_name, offset=off, length=ln)      # needs raw_data present ...
                          t.ClearField("raw_data")                                               # ... then drop the inline copy
                      onnx.save_model(m, p + ".tmp", save_as_external_data=False)
                      os.replace(p + ".tmp", p)
                      after += os.path.getsize(p)
                      del m; gc.collect()
              shared_sz = os.path.getsize(shared_path)
              if not index:                                    # nothing big enough to share -> do not ship an empty asset
                  os.remove(shared_path)
