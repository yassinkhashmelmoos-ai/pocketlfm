      - name: Quantize edit-mode text encoder
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import os, gc, json
          import onnx
          from onnxruntime.quantization import quantize_dynamic, QuantType

          src = "dreamlite_onnx/text_encoder_edit_fp16.onnx"
          dst = "dreamlite_onnx/text_encoder_edit.onnx"

