name: Build Thunder AGI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove adaptive icon overrides
        run: |
          rm -f lfm25/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          rm -f lfm25/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          echo "Adaptive icon XMLs removed"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Python deps
        run: |
          pip install Pillow
          # torch 2.3.1 — matches what worked in previous runs
          pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.40.2" "diffusers==0.27.2" accelerate onnx "onnxruntime==1.17.3"
          pip install "huggingface_hub==0.22.2"

      - name: Generate mipmap icon sizes
        run: |
          python3 << 'PYEOF'
          from PIL import Image
          import os
          src = "lfm25/app/src/main/assets/app_icon_source.jpg"
          if not os.path.exists(src):
              print("WARNING: app_icon_source.jpg not found, skipping icons")
          else:
              sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
              img = Image.open(src).convert("RGBA")
              for name, size in sizes.items():
                  d = f"lfm25/app/src/main/res/mipmap-{name}"
                  os.makedirs(d, exist_ok=True)
                  r = img.resize((size,size), Image.LANCZOS)
                  r.save(f"{d}/ic_launcher.webp","WEBP")
                  r.save(f"{d}/ic_launcher_round.webp","WEBP")
                  print(f"✓ {name} {size}x{size}")
          PYEOF

      - name: Download LFM2.5-VL model
        run: |
          mkdir -p lfm25/app/src/main/assets
          wget -q --show-progress \
            "https://huggingface.co/LiquidAI/LFM2.5-VL-450M-GGUF/resolve/main/LFM2.5-VL-450M-Q4_K_M.gguf" \
            -O lfm25/app/src/main/assets/model.gguf
          echo "LFM model: $(du -sh lfm25/app/src/main/assets/model.gguf)"

      - name: Export ONNX models for offline image generation
        run: |
          python3 << 'PYEOF'
          import os, sys, torch, json
          print(f"torch version: {torch.__version__}")
          print("=== ONNX Export Pipeline ===")

          from diffusers import AutoencoderKL, UNet2DConditionModel
          from transformers import CLIPTextModel, CLIPTokenizer
          import numpy as np

          os.makedirs("dreamlite_onnx", exist_ok=True)

          # ── 1. VAE decoder (madebyollin/sdxl-vae-fp16-fix) ────────────────
          # This model exports cleanly with torch 2.3.1 — confirmed working
          print("\n[1/3] VAE decoder...")
          try:
              vae = AutoencoderKL.from_pretrained(
                  "madebyollin/sdxl-vae-fp16-fix",
                  torch_dtype=torch.float32)
              vae.eval()
              dummy = torch.randn(1, 4, 64, 64)
              torch.onnx.export(
                  vae.decoder,
                  dummy,
                  "dreamlite_onnx/vae_decoder.onnx",
                  input_names=["latent_sample"],
                  output_names=["image"],
                  dynamic_axes={"latent_sample": {0: "batch"}},
                  opset_version=14)  # opset 14 avoids scaled_dot_product issues
              print(f"✓ VAE decoder: {os.path.getsize('dreamlite_onnx/vae_decoder.onnx')//1024//1024} MB")
              del vae
          except Exception as e:
              print(f"✗ VAE export failed: {e}")

          # ── 2. CLIP text encoder ───────────────────────────────────────────
          # Use opset 14 and disable scripted SDPA which breaks onnx export
          # in transformers >= 4.36 when torch uses flash attention.
          print("\n[2/3] CLIP text encoder...")
          try:
              import transformers
              # Disable fast attention for ONNX export compatibility
              transformers.utils.is_flash_attn_2_available = lambda: False

              text_encoder = CLIPTextModel.from_pretrained(
                  "openai/clip-vit-large-patch14",
                  torch_dtype=torch.float32,
                  attn_implementation="eager")  # force eager attention, not SDPA
              text_encoder.eval()

              dummy_ids = torch.zeros((1, 77), dtype=torch.long)
              with torch.no_grad():
                  torch.onnx.export(
                      text_encoder,
                      dummy_ids,
                      "dreamlite_onnx/text_encoder.onnx",
                      input_names=["input_ids"],
                      output_names=["last_hidden_state", "pooler_output"],
                      dynamic_axes={"input_ids": {0: "batch"}},
                      opset_version=14)
              print(f"✓ Text encoder: {os.path.getsize('dreamlite_onnx/text_encoder.onnx')//1024//1024} MB")
              del text_encoder
          except Exception as e:
              print(f"✗ Text encoder export failed: {e}")
              # Fallback: download pre-exported CLIP from optimum
              print("  Trying pre-exported CLIP from optimum-community...")
              try:
                  from huggingface_hub import hf_hub_download
                  hf_hub_download(
                      repo_id="optimum-community/clip-vit-large-patch14",
                      filename="model.onnx",
                      local_dir="dreamlite_onnx",
                      local_dir_use_symlinks=False)
                  os.rename("dreamlite_onnx/model.onnx", "dreamlite_onnx/text_encoder.onnx")
                  print(f"✓ CLIP from optimum: {os.path.getsize('dreamlite_onnx/text_encoder.onnx')//1024//1024} MB")
              except Exception as e2:
                  print(f"  Optimum fallback also failed: {e2}")

          # ── 3. UNet ────────────────────────────────────────────────────────
          # Use stable-diffusion-v1-5 — universally available, torch-safe weights,
          # compatible with the CLIP ViT-L/14 text encoder above.
          # This is the correct pairing: SD 1.5 UNet + CLIP ViT-L/14 text encoder.
          # DreamLite-base uses a custom config that is incompatible with standard
          # UNet2DConditionModel (confirmed failing above). SD 1.5 is the reliable
          # mobile-optimised baseline with identical interface.
          print("\n[3/3] UNet (stable-diffusion-v1-5)...")
          unet_exported = False
          try:
              unet = UNet2DConditionModel.from_pretrained(
                  "runwayml/stable-diffusion-v1-5",
                  subfolder="unet",
                  torch_dtype=torch.float32)
              unet.eval()
              with torch.no_grad():
                  torch.onnx.export(
                      unet,
                      (torch.randn(2, 4, 64, 64),
                       torch.tensor([999, 999]),
                       torch.randn(2, 77, 768)),
                      "dreamlite_onnx/unet.onnx",
                      input_names=["sample", "timestep", "encoder_hidden_states"],
                      output_names=["out_sample"],
                      opset_version=14)
              unet_exported = True
              print(f"✓ SD1.5 UNet: {os.path.getsize('dreamlite_onnx/unet.onnx')//1024//1024} MB")
              del unet
          except Exception as e:
              print(f"✗ SD1.5 UNet failed: {e}")

          # ── 4. Manifest ────────────────────────────────────────────────────
          onnx_files = [f for f in os.listdir("dreamlite_onnx") if f.endswith(".onnx")]
          manifest = {
              "version": "2.0",
              "components": onnx_files,
              "has_vae":     "vae_decoder.onnx"  in onnx_files,
              "has_encoder": "text_encoder.onnx" in onnx_files,
              "has_unet":    "unet.onnx"          in onnx_files,
              "params": {
                  "num_inference_steps": 20,
                  "guidance_scale": 7.5,
                  "negative_prompt": "blurry, distorted, ugly, bad anatomy, text, watermark",
                  "resolution": 512,
                  "latent_dim": 64
              }
          }
          with open("dreamlite_onnx/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)

          print("\n=== Export summary ===")
          for f in sorted(os.listdir("dreamlite_onnx")):
              size = os.path.getsize(f"dreamlite_onnx/{f}")
              print(f"  {f}: {size//1024//1024} MB" if size > 1024*1024 else f"  {f}: {size} B")
          PYEOF

      # FIX: Copy ONNX files DIRECTLY into assets — no zip container.
      # Previously the workflow ran "zip -r assets/dreamlite.zip ." which caused
      # double-compression: aapt re-compressed the zip inside the APK even with
      # noCompress set, because noCompress only covers the outer file extension.
      # Storing files flat in assets/ with noCompress += "onnx" means aapt stores
      # each .onnx uncompressed, and ImageGenerator.kt copies them to filesDir
      # on first launch for ONNX Runtime to read as normal files.
      - name: Copy ONNX files directly into assets (no zip container)
        run: |
          mkdir -p lfm25/app/src/main/assets
          exported=0
          for f in dreamlite_onnx/vae_decoder.onnx dreamlite_onnx/text_encoder.onnx dreamlite_onnx/unet.onnx dreamlite_onnx/manifest.json; do
            if [ -f "$f" ]; then
              cp "$f" lfm25/app/src/main/assets/
              echo "✓ Copied $(basename $f): $(du -sh $f | cut -f1)"
              exported=$((exported+1))
            else
              echo "⚠ $(basename $f) not available"
            fi
          done
          echo "Total ONNX components copied: $exported"
          echo "Assets:"
          ls -lh lfm25/app/src/main/assets/

      - name: Install NDK and CMake
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name "sdkmanager" | head -1)
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x lfm25/gradlew

      - name: Generate consistent signing keystore
        run: |
          KEYSTORE_PATH="$HOME/thunder_agi.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -alias thunder_agi \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass ThunderAGI2026! \
              -keypass ThunderAGI2026! \
              -dname "CN=Thunder AGI, OU=Thunder, O=Yassin Khashelmoos, L=Khartoum, ST=Khartoum, C=SD"
            echo "Keystore generated"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV

      - name: Build Release APK
        working-directory: lfm25
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ env.KEYSTORE_PATH }} \
            -Pandroid.injected.signing.store.password=ThunderAGI2026! \
            -Pandroid.injected.signing.key.alias=thunder_agi \
            -Pandroid.injected.signing.key.password=ThunderAGI2026! \
            --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Copy APK to output
        run: |
          mkdir -p output
          APK="lfm25/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="lfm25/app/build/outputs/apk/debug/app-debug.apk"
            echo "Using debug APK"
          fi
          cp "$APK" "output/ThunderAGI-الرعد-v3.apk"
          echo "APK size: $(du -sh output/ThunderAGI-الرعد-v3.apk)"

      - name: Verify APK
        run: |
          python3 -c "
          import zipfile, sys
          with zipfile.ZipFile('output/ThunderAGI-الرعد-v3.apk') as z:
              files = z.namelist()
              onnx = [f for f in files if f.endswith('.onnx')]
              print(f'APK OK: {len(files)} files, ONNX={onnx}')
              if not any(f.endswith('.dex') for f in files):
                  sys.exit(1)
          "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAGI-الرعد-v3
          path: output/ThunderAGI-الرعد-v3.apk
          retention-days: 30

      - name: Show install instructions
        run: |
          echo "=== HOW TO INSTALL ==="
          echo "1. Download the artifact ZIP from GitHub Actions"
          echo "2. EXTRACT the ZIP — you will find ThunderAGI-الرعد-v3.apk inside"
          echo "3. Copy the .apk to your phone and tap to install"
          echo "APK size: $(du -sh output/ThunderAGI-الرعد-v3.apk)"
