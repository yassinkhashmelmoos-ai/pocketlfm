name: Build Thunder AGI APK

# ══════════════════════════════════════════════════════════════════════════════════════════════
#  Quantized on-device image stack.  Everything shipped is executable by onnxruntime-android 1.17.0
#  (the version in app/build.gradle.kts) and every model is ONE self-contained file < 2 GB, because
#  the app's asset-copy list names only <model>.onnx files (it never copies *.onnx.data).
#
#   UNet    Chameleon-style per-tensor weight formats (SQNR-selected): Conv INT8 | Linear INT4-g32/INT8
#   VAE     PassionSR-flavoured: INT8 per-channel weights with MSE-optimal clip search, first/last conv FP32
#   Gen enc Q4_K_M-class mix: INT4-g32 (HQQ-refined) + INT8 for v/down on llama.cpp's "more bits" layers
#   Edit    same LM recipe; vision tower + merger INT8 (never INT4)
#   +       Basis Sharing (whitened, error-budgeted) and optional LM-weight sharing between the encoders
#  Every stage is judged against FP32 outputs on REAL inputs, run on an ORT 1.17.0 sandbox, and falls
#  back to the next-safer recipe (finally the original FP16/FP32 model) if its fidelity gate fails.
# ══════════════════════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      basis_sharing:
        description: "Try Basis Sharing on the text encoders (applied only where it passes the activation-space error budget)"
        type: boolean
        default: true
      share_lm_weights:
        description: "Store the Qwen LM weights once for BOTH encoders (about -1.2 GB). CI patches the app's asset copy-list; no repo change"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ENABLE_BS: ${{ (github.event_name != 'workflow_dispatch' || inputs.basis_sharing) && '1' || '0' }}
      SHARE_LM: ${{ (github.event_name == 'workflow_dispatch' && inputs.share_lm_weights) && '1' || '0' }}

    steps:

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # This action removes pre-installed toolchains you don't need. yes
          tool-cache: true   # ← frees ~15-20 GB (was false)/ Python/Node are needed.
          android: true       # Frees ~14 GB (Android SDK & NDK)
          dotnet: true        # Frees ~2.7 GB
          haskell: true       # Frees ~5 GB (GHC)
          large-packages: true # Frees ~5.3 GB
          docker-images: true # Frees Docker cache
          swap-storage: true  # Frees pre-existing swap (your custom swap is separate)
      

      - name: Increase swap space (prevent OOM)
        run: |
          sudo fallocate -l 12G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove adaptive icon overrides
        run: |
          rm -f lfm25/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          rm -f lfm25/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          echo "Adaptive icon XMLs removed"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install Pillow
          pip install "torch==2.14.1" torchvision --index-url https://download.pytorch.org/whl/cpu

          pip install --no-cache-dir \
            "transformers==4.57.3" \
            accelerate \
            onnx \
            onnxscript \
            "onnxruntime==1.18.0" \
            "numpy<2" \
            "onnxconverter-common" \
            "datasets>=3.2.0" \
            "pyarrow>=16,<26" \
            "prettytable" \
            "schema" \
            "pandas" \
            "scikit-learn" \
            "opencv-python" \
            "deprecated" \
            "psutil" \
            "py-cpuinfo" \
            httpx

          pip uninstall -y diffusers huggingface-hub || true
          pip install --no-cache-dir --no-deps "git+https://github.com/huggingface/diffusers.git"
          pip install --no-cache-dir "huggingface-hub>=0.34.0,<1.0"

          python -c "import huggingface_hub; from packaging.version import Version; v=huggingface_hub.__version__; assert Version(v) < Version('1.0.0') and Version(v) >= Version('0.34.0'), f'hf-hub {v} not in [0.34.0, 1.0.0)'; print(f'hf-hub {v} OK')"      # FIX: added per the user's own debugging — diffusers-from-main (needed for
         
          
      # DreamLitePipeline/DreamLiteUNetModel, neither tagged in a release yet) calls
      # a few huggingface_hub APIs (resolve_revision, RevisionResolutionError,
      # get_cached_repo_tree) that the pinned huggingface-hub version above doesn't
      # have yet. This patches diffusers/utils/hub_utils.py with no-op/pass-through
      # stubs for exactly those, plus broad __getattr__ fallbacks for anything else
      # missing, so pipeline loading doesn't hard-fail on an AttributeError before
      # ever reaching the actual export code.

      - name: Patch diffusers for huggingface_hub compatibility
        run: |
          SHIM=/tmp/hub_compat_shim.py
          printf '%s\n' \
            '# diffusers-hub-compat-shim-v2' \
            'import huggingface_hub as _hfh' \
            'import huggingface_hub.errors as _hfh_err' \
            'import huggingface_hub.utils as _hfh_util' \
            '' \
            'def _make_stub(name):' \
            '    def _stub(*a, **k):' \
            '        return None' \
            '    _stub.__name__ = name' \
            '    return _stub' \
            '' \
            'if not hasattr(_hfh, "resolve_revision"):' \
            '    def _resolve_revision_stub(*a, **k):' \
            '        if "revision" in k:' \
            '            return k["revision"]' \
            '        if len(a) >= 2:' \
            '            return a[1]' \
            '        return "main"' \
            '    _hfh.resolve_revision = _resolve_revision_stub' \
            '' \
            'if not hasattr(_hfh_err, "RevisionResolutionError"):' \
            '    class RevisionResolutionError(Exception):' \
            '        pass' \
            '    _hfh_err.RevisionResolutionError = RevisionResolutionError' \
            '' \
            'if not hasattr(_hfh_util, "httpx"):' \
            '    try:' \
            '        import httpx as _httpx' \
            '        _hfh_util.httpx = _httpx' \
            '    except ImportError:' \
            '        import huggingface_hub.utils._http as _http_mod' \
            '        _hfh_util.httpx = _http_mod' \
            '' \
            'if not hasattr(_hfh, "get_cached_repo_tree"):' \
            '    def _get_cached_repo_tree_stub(*a, **k):' \
            '        return []' \
            '    _hfh.get_cached_repo_tree = _get_cached_repo_tree_stub' \
            '' \
            'if not hasattr(_hfh, "__getattr__"):' \
            '    def _hfh_getattr(name):' \
            '        return _make_stub(name)' \
            '    _hfh.__getattr__ = _hfh_getattr' \
            '' \
            'if not hasattr(_hfh_err, "__getattr__"):' \
            '    def _hfh_err_getattr(name):' \
            '        return type(name, (Exception,), {})' \
            '    _hfh_err.__getattr__ = _hfh_err_getattr' \
            '' \
            'if not hasattr(_hfh_util, "__getattr__"):' \
            '    def _hfh_util_getattr(name):' \
            '        return _make_stub(name)' \
            '    _hfh_util.__getattr__ = _hfh_util_getattr' \
            > "$SHIM"

          python3 -c '
          import importlib.util, os, sys
          spec = importlib.util.find_spec("diffusers")
          path = os.path.join(os.path.dirname(spec.origin), "utils", "hub_utils.py")
          with open(path) as f:
              text = f.read()
          if "# diffusers-hub-compat-shim-v2" in text:
              print("Already patched with v2")
              sys.exit(0)
          with open("/tmp/hub_compat_shim.py") as f:
              shim = f.read()
          if not shim.endswith("\n"):
              shim += "\n"
          with open(path, "w") as f:
              f.write(shim + text)
          print("Patched " + path)
          '

      - name: "Create on-device-equivalent ONNX Runtime sandbox (same version as the app's onnxruntime-android)"
        run: |
          ORT_APP=$(grep -oP 'onnxruntime-android:\K[0-9]+\.[0-9]+\.[0-9]+' lfm25/app/build.gradle.kts | head -1)
          ORT_APP=${ORT_APP:-1.17.0}
          echo "App ships onnxruntime-android $ORT_APP -> building a matching python sandbox"
          python3 -m venv "$HOME/ort_device"
          "$HOME/ort_device/bin/pip" install --no-cache-dir "numpy<2" "onnxruntime==$ORT_APP"
          "$HOME/ort_device/bin/python" -c "import onnxruntime as o; print('device-equivalent runtime: ORT', o.__version__)"
          python3 -c "import onnxruntime as o; print('build-side runtime (quantizers, FP32 references): ORT', o.__version__)"
          echo "ORT117_PY=$HOME/ort_device/bin/python" >> "$GITHUB_ENV"

      - name: "Write quantization toolkit — quantlib.py (part 1/3)"
        run: |
          mkdir -p quant
          cat > quant/quantlib.py << 'PYEOF_QUANTLIB_0'
          """
          quantlib.py -- Thunder AGI on-device quantization toolkit.

          Everything produced here is executable by onnxruntime-android 1.17.0 (the version the app ships):
            * INT8 weight-only per-channel via DequantizeLinear (no activation quantization, not constant-folded)
            * INT4 block-wise (g=32, asymmetric) via com.microsoft MatMulNBits  (+ NumPy half-quadratic refinement)
            * row-wise INT8 embedding tables (Gather + Cast + Mul)
            * FP16 weight storage via Cast
            * single-file output (< 2 GiB, no external data) with IR version capped for ORT 1.17
          Nothing here needs INT4-QDQ, opset 21, FP8 or MX kernels (all of which ORT 1.17 cannot run).
          """
          import os, gc, json, math, copy, time, subprocess, sys, hashlib
          import numpy as np
          import onnx
          from onnx import numpy_helper, helper, TensorProto

          MS = "com.microsoft"
          F32, F16 = TensorProto.FLOAT, TensorProto.FLOAT16
          MAX_PROTO = 2_000_000_000          # stay safely below the 2 GiB protobuf limit


          def log(*a):
              print(*a, flush=True)


          # ───────────────────────────── manifest helpers ─────────────────────────────
          def read_manifest(d):
              p = os.path.join(d, "manifest.json")
              return json.load(open(p)) if os.path.exists(p) else {"params": {}}


          def write_manifest(d, m):
              with open(os.path.join(d, "manifest.json"), "w") as f:
                  json.dump(m, f, indent=2)


          def update_manifest(d, **kv):
              m = read_manifest(d)
              m.update(kv)
              write_manifest(d, m)
              return m


          # ───────────────────────────── numeric helpers ──────────────────────────────
          def sqnr_db(w, wq):
              num = float((w.astype(np.float64) ** 2).mean())
              den = float(((w.astype(np.float64) - wq.astype(np.float64)) ** 2).mean())
              return 99.0 if den <= 0 else 10.0 * math.log10(max(num, 1e-30) / den)


          def cos_sim(a, b):
              a = a.reshape(-1).astype(np.float64); b = b.reshape(-1).astype(np.float64)
              d = np.linalg.norm(a) * np.linalg.norm(b)
              return 1.0 if d == 0 else float(a @ b / d)


          # ───────────────────────────── lazy weight access ───────────────────────────
          class Source:
              """Reads initializers lazily (inline or external-data) so a 7 GB FP32 model never sits in RAM."""

              def __init__(self, model, base_dir):
                  self.model, self.dir = model, base_dir
                  self.map = {t.name: t for t in model.graph.initializer}

              def has(self, n): return n in self.map
              def shape(self, n): return tuple(self.map[n].dims)
              def dtype(self, n): return self.map[n].data_type

              def array(self, n):
                  a = numpy_helper.to_array(self.map[n], self.dir)
                  return a.astype(np.float32) if a.dtype == np.float16 else a


          # ───────────────────────────── graph utilities ──────────────────────────────
          def normalize_names(model):
              seen = set()
              for i, n in enumerate(model.graph.node):
                  nm = n.name
                  if not nm or nm in seen:
                      base = nm or n.op_type
                      k = 0
                      while f"{base}__{i}_{k}" in seen:
                          k += 1
                      nm = f"{base}__{i}_{k}"
                      n.name = nm
                  seen.add(nm)


          def _node_deps(n):
              deps = set(i for i in n.input if i)
              for a in n.attribute:
                  subs = [a.g] if a.type == onnx.AttributeProto.GRAPH else list(a.graphs) if a.type == onnx.AttributeProto.GRAPHS else []
                  for g in subs:
                      for m in g.node:
                          deps |= _node_deps(m)
              return deps


          def prune_unreachable(model):
              """Dead-code elimination from the graph outputs; also drops unreferenced initializers (e.g. an unused tied lm_head copy)."""
              g = model.graph
              producer = {}
              for n in g.node:
                  for o in n.output:
                      producer[o] = n
              keep, stack = set(), [o.name for o in g.output]
              while stack:
                  t = stack.pop()
                  n = producer.get(t)
                  if n is None or id(n) in keep:
                      continue
                  keep.add(id(n))
                  stack.extend(_node_deps(n))
              kept_nodes = [n for n in g.node if id(n) in keep]
              removed = len(g.node) - len(kept_nodes)
              used = set()
              for n in kept_nodes:
                  used |= _node_deps(n)
              used |= {o.name for o in g.output}
              kept_inits = [t for t in g.initializer if t.name in used]
              dropped_bytes = sum(int(np.prod(t.dims or [1])) * 4 for t in g.initializer if t.name not in used)
              del g.node[:]; g.node.extend(kept_nodes)
              del g.initializer[:]; g.initializer.extend(kept_inits)
              return removed, dropped_bytes


          def ensure_opset(model, domain, version):
              for o in model.opset_import:
                  if o.domain == domain:
                      o.version = max(o.version, version) if domain != "" else o.version
                      return
              model.opset_import.append(helper.make_opsetid(domain, version))


          def default_opset(model):
              for o in model.opset_import:
                  if o.domain in ("", "ai.onnx"):
                      return o.version
              return 0


          # ───────────────────────────── block-INT4 quantizers ────────────────────────
          def _rtn_blocks(b):
              mn, mx = b.min(-1, keepdims=True), b.max(-1, keepdims=True)
              s = (mx - mn) / 15.0
              s = np.where(s <= 1e-12, 1.0, s)
              z = np.clip(np.round(-mn / s), 0, 15)
              q = np.clip(np.round(b / s + z), 0, 15)
              return q, s, z


          def _hqq_blocks(b, iters=12, p=0.7, beta=10.0, kappa=1.01):
              """Half-quadratic (HQQ) refinement of the zero point with an lp (p<1) loss, then integer-zero + LS scale refit.
              Falls back to plain RTN per block whenever RTN has lower L2 error, so it is never worse than RTN in L2."""
              q0, s0, z0 = _rtn_blocks(b)
              mn = b.min(-1, keepdims=True)
              s = s0
              z = -mn / s
              best = None
              for _ in range(iters):
                  q = np.clip(np.round(b / s + z), 0, 15)
                  wr = (q - z) * s
                  e = b - wr
                  a = np.abs(e)
                  e = np.sign(e) * np.maximum(a - (1.0 / beta) * np.power(a + 1e-8, p - 1.0), 0.0)
                  z = np.mean(q - (b - e) / s, axis=-1, keepdims=True)
                  beta *= kappa
                  cur = float(np.abs(b - wr).mean())
                  if best is not None and cur >= best:
                      break
                  best = cur
              zi = np.clip(np.round(z), 0, 15)
              q = np.clip(np.round(b / s + zi), 0, 15)
              d = q - zi
              num, den = (d * b).sum(-1, keepdims=True), (d * d).sum(-1, keepdims=True)
              s2 = np.where(den > 0, num / np.maximum(den, 1e-12), s)
              s2 = np.where(s2 <= 1e-12, s, s2)
              q = np.clip(np.round(b / s2 + zi), 0, 15)
              e_h = ((q - zi) * s2 - b) ** 2
              e_r = ((q0 - z0) * s0 - b) ** 2
              use_h = (e_h.sum(-1, keepdims=True) <= e_r.sum(-1, keepdims=True))
              return np.where(use_h, q, q0), np.where(use_h, s2, s0), np.where(use_h, zi, z0)


          def quant_nbits(w2d, block=32, algo="hqq"):
              """w2d: [K,N] float32 (ONNX MatMul layout).  Returns packed MatMulNBits tensors + the dequantized weight for SQNR."""
              K, N = w2d.shape
              kb = (K + block - 1) // block
              wp = np.pad(w2d, ((0, kb * block - K), (0, 0))) if kb * block > K else w2d
              b = np.ascontiguousarray(wp.T).reshape(N, kb, block).astype(np.float32)        # every block comes from ONE output column
              q, s, z = (_hqq_blocks(b) if algo == "hqq" else _rtn_blocks(b))
              deq = ((q - z) * s).reshape(N, kb * block)[:, :K].T
              q8 = q.astype(np.uint8)
              packed = (q8[..., 0::2] | (q8[..., 1::2] << 4)).astype(np.uint8)               # [N, kb, block/2]
              zz = z.astype(np.uint8).reshape(N, kb)
              if kb % 2:
                  zz = np.pad(zz, ((0, 0), (0, 1)))
              zpacked = (zz[:, 0::2] | (zz[:, 1::2] << 4)).astype(np.uint8).reshape(-1)      # [N * ceil(kb/2)]
              return packed, s.reshape(-1).astype(np.float32), zpacked, deq, sqnr_db(w2d, deq)


          def quant_int8_perchannel(w, axis, clips=(1.0, 0.999, 0.995, 0.99, 0.98, 0.96), chunk=16384):
              """Per-output-channel symmetric INT8 with an MSE-optimal clip search per channel (a PTQ stand-in for a learned boundary)."""
              wm_all = np.moveaxis(w, axis, 0)
              C = wm_all.shape[0]
              wm_all = wm_all.reshape(C, -1)
              q_all = np.empty(wm_all.shape, np.int8)
              s_all = np.empty(C, np.float32)
              err_tot = 0.0
              for c0 in range(0, C, chunk):
                  wm = wm_all[c0:c0 + chunk].astype(np.float32)
                  amax = np.abs(wm).max(axis=1)
                  best_e, best_s = None, None
                  for r in clips:
                      s = np.maximum(amax * r / 127.0, 1e-12).astype(np.float32)
                      q = np.clip(np.round(wm / s[:, None]), -127, 127)
                      e = ((q * s[:, None] - wm) ** 2).sum(axis=1)
                      if best_e is None:
                          best_e, best_s = e, s
                      else:
                          m = e < best_e
                          best_e, best_s = np.where(m, e, best_e), np.where(m, s, best_s)
                  q_all[c0:c0 + chunk] = np.clip(np.round(wm / best_s[:, None]), -127, 127).astype(np.int8)
                  s_all[c0:c0 + chunk] = best_s
                  err_tot += float(best_e.sum())
              power = float((w.astype(np.float64) ** 2).sum())
              sq = 99.0 if err_tot <= 0 else 10 * math.log10(max(power, 1e-30) / err_tot)
              q = np.moveaxis(q_all.reshape(wm_all.shape[0:1] + np.moveaxis(w, axis, 0).shape[1:]), 0, axis)
              return np.ascontiguousarray(q), s_all, sq


          # ───────────────────────────── the rewriter ─────────────────────────────────
          _NB_CACHE = {}


          class Rewriter:
              """Builds a quantized copy of a graph, streaming FP32 weights one tensor at a time."""

              def __init__(self, model, base_dir):
                  self.m = copy.deepcopy(model)                    # graph-only copy (external-data references stay references)
                  self.src = Source(self.m, base_dir)
                  normalize_names(self.m)
                  self.removed_inits, self.added_inits = set(), []
                  self.before = {}                                  # node.name -> [nodes emitted right before it]
                  self.replace = {}                                 # node.name -> [replacement nodes]
                  self.stats = {}                                   # fmt -> params
                  self.log = []                                     # (node, weight, fmt, sqnr)
                  self.n_uses = {}
                  for n in self.m.graph.node:
                      for i in n.input:
                          self.n_uses[i] = self.n_uses.get(i, 0) + 1

              # -- bookkeeping --
              def _count(self, fmt, params, bytes_):
                  d = self.stats.setdefault(fmt, {"params": 0, "bytes": 0, "tensors": 0})
                  d["params"] += int(params); d["bytes"] += int(bytes_); d["tensors"] += 1

              def _release(self, wname):
                  self.n_uses[wname] = self.n_uses.get(wname, 1) - 1
                  if self.n_uses[wname] <= 0 and self.src.has(wname):
                      self.removed_inits.add(wname)

              def _add(self, name, arr):
                  self.added_inits.append(numpy_helper.from_array(arr, name))

              # -- formats --
              def int8_dq(self, node, in_idx, axis, tag=None):
                  """Weight-only INT8 (per-channel) -> DequantizeLinear feeding `node.input[in_idx]`."""
                  wname = node.input[in_idx]
                  w = self.src.array(wname)
                  q, s, sq = quant_int8_perchannel(w, axis)
                  base = f"{wname}::{node.name}"
                  self._add(base + "::q8", q)
                  self._add(base + "::s8", s)
                  dq = helper.make_node("DequantizeLinear", [base + "::q8", base + "::s8"], [base + "::dq"], name=base + "::DQ", axis=axis)
                  self.before.setdefault(node.name, []).append(dq)
                  node.input[in_idx] = base + "::dq"
                  self._release(wname)
                  self._count("int8", w.size, q.nbytes + s.nbytes)
                  self.log.append((node.name, wname, "int8", sq))
                  return sq

              def nbits4(self, node, algo="hqq", block=32, min_sqnr=None):
                  """MatMul(A, W[K,N]) -> MatMulNBits (4-bit, g=block, asym).  Returns (applied, sqnr)."""
                  wname = node.input[1]
                  w = self.src.array(wname)
                  key = (wname, w.shape, algo, block)
                  if key in _NB_CACHE:
                      packed, scales, zp, sq = _NB_CACHE[key]                     # same tensor, same recipe in an earlier ladder rung
                  else:
                      packed, scales, zp, _, sq = quant_nbits(w, block, algo)
                      if os.environ.get("QUANT_NO_CACHE") != "1":
                          _NB_CACHE[key] = (packed, scales, zp, sq)
                  if min_sqnr is not None and sq < min_sqnr:
                      return False, sq
                  K, N = w.shape
                  base = f"{wname}::{node.name}"
                  self._add(base + "::Q4", packed); self._add(base + "::scales", scales); self._add(base + "::zp", zp)
                  new = helper.make_node("MatMulNBits", [node.input[0], base + "::Q4", base + "::scales", base + "::zp"], [node.output[0]],
                                         name=node.name + "::Q4", domain=MS, K=int(K), N=int(N), bits=4, block_size=int(block))
                  self.replace[node.name] = [new]
                  self._release(wname)
                  self._count("int4", w.size, packed.nbytes + scales.nbytes + zp.nbytes)
                  self.log.append((node.name, wname, "int4", sq))
                  return True, sq

              def fp16_weight(self, node, in_idx):
                  wname = node.input[in_idx]
                  w = self.src.array(wname)
                  base = f"{wname}::{node.name}"
                  self._add(base + "::f16", w.astype(np.float16))
                  c = helper.make_node("Cast", [base + "::f16"], [base + "::f32"], name=base + "::Cast", to=F32)
                  self.before.setdefault(node.name, []).append(c)
                  node.input[in_idx] = base + "::f32"
                  self._release(wname)
                  self._count("fp16", w.size, w.size * 2)

              def embedding_int8(self, node):
                  """Gather(E[V,D], ids) -> row-wise INT8 table; dequantization happens on the gathered rows only."""
                  wname = node.input[0]
                  E = self.src.array(wname)
                  V, D = E.shape
                  amax = np.abs(E).max(axis=1)
                  s = np.maximum(amax / 127.0, 1e-12).astype(np.float32)
                  q = np.empty(E.shape, np.int8)
                  for r0 in range(0, V, 32768):
                      q[r0:r0 + 32768] = np.clip(np.round(E[r0:r0 + 32768] / s[r0:r0 + 32768, None]), -127, 127).astype(np.int8)
                  base = f"{wname}::emb"
                  self._add(base + "::q8", q); self._add(base + "::s", s)
                  self._add(base + "::axes", np.array([-1], dtype=np.int64))
                  ids = node.input[1]
                  axis = next((a.i for a in node.attribute if a.name == "axis"), 0)
                  nodes = [
                      helper.make_node("Gather", [base + "::q8", ids], [base + "::rows"], name=base + "::G1", axis=axis),
                      helper.make_node("Gather", [base + "::s", ids], [base + "::sc"], name=base + "::G2", axis=axis),
                      helper.make_node("Cast", [base + "::rows"], [base + "::rowsf"], name=base + "::C", to=F32),
                      helper.make_node("Unsqueeze", [base + "::sc", base + "::axes"], [base + "::scu"], name=base + "::U"),
                      helper.make_node("Mul", [base + "::rowsf", base + "::scu"], [node.output[0]], name=base + "::M"),
                  ]
                  self.replace[node.name] = nodes
                  self._release(wname)
                  deq = q.astype(np.float32) * s[:, None] if V * D < 5_000_000 else None
                  self._count("int8_embed", E.size, q.nbytes + s.nbytes)
                  self.log.append((node.name, wname, "int8_embed", sqnr_db(E, deq) if deq is not None else 50.0))

              def catch_all_int8(self, min_params=1_000_000):
                  """Safety net: any large float weight still feeding a MatMul/Gemm/Conv is stored INT8 (per-channel), whatever the op pattern."""
                  k = 0
                  for n in list(self.m.graph.node):
                      if n.name in self.replace or n.op_type not in ("MatMul", "Gemm", "Conv") or len(n.input) < 2:
