name: Build Thunder AGI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Large runner needed for DreamLite conversion (~8GB RAM required)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove adaptive icon overrides (use density-specific webp icons instead)
        run: |
          # The mipmap-anydpi XMLs define an adaptive icon using the lightning bolt
          # vector drawable, which overrides ALL density-specific webp files on
          # Android 8+. Deleting them forces Android to use the correctly-sized
          # webp files generated in the icon step below.
          rm -f lfm25/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          rm -f lfm25/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          echo "Adaptive icon XMLs removed"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Python deps
        run: |
          pip install Pillow
          pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.57.3" "diffusers==0.30.3" accelerate onnx onnxruntime
          pip install huggingface_hub

      - name: Generate all mipmap icon sizes from source icon
        run: |
          python3 << 'PYEOF'
          from PIL import Image
          import os, sys
          src = "lfm25/app/src/main/assets/app_icon_source.jpg"
          if not os.path.exists(src):
              print("WARNING: app_icon_source.jpg not found, skipping icons")
          else:
              sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
              img = Image.open(src).convert("RGBA")
              for name, size in sizes.items():
                  d = f"lfm25/app/src/main/res/mipmap-{name}"
                  os.makedirs(d, exist_ok=True)
                  r = img.resize((size,size), Image.LANCZOS)
                  r.save(f"{d}/ic_launcher.webp","WEBP")
                  r.save(f"{d}/ic_launcher_round.webp","WEBP")
                  print(f"✓ {name} {size}x{size}")
          PYEOF

      - name: Download LFM2.5-VL model
        run: |
          mkdir -p lfm25/app/src/main/assets
          wget -q --show-progress \
            "https://huggingface.co/LiquidAI/LFM2.5-VL-450M-GGUF/resolve/main/LFM2.5-VL-450M-Q4_K_M.gguf" \
            -O lfm25/app/src/main/assets/model.gguf
          echo "LFM model: $(du -sh lfm25/app/src/main/assets/model.gguf)"

      - name: Download and convert DreamLite to ONNX for Android
        run: |
          python3 << 'PYEOF'
          import os, sys, torch
          print("=== DreamLite ONNX Export Pipeline ===")
          
          # ── Download components ────────────────────────────────────────────
          from huggingface_hub import hf_hub_download, snapshot_download
          from diffusers import AutoencoderKL
          from transformers import AutoTokenizer, CLIPTextModel
          import numpy as np
          
          os.makedirs("dreamlite_onnx", exist_ok=True)
          
          print("Downloading DreamLite-base UNet (public, no token needed)...")
          try:
              # Download just the UNet config and weights from diffusers branch
              unet_path = snapshot_download(
                  "carlofkl/DreamLite-base",
                  revision="diffusers",
                  ignore_patterns=["*.safetensors", "*.bin"],  # configs only first
                  local_dir="dreamlite_base"
              )
              print(f"Config downloaded to {unet_path}")
          except Exception as e:
              print(f"DreamLite download failed: {e}")
              print("Falling back to SDXL-based lightweight pipeline...")
          
          print("Downloading HD VAE (madebyollin/sdxl-vae-fp16-fix)...")
          try:
              vae = AutoencoderKL.from_pretrained(
                  "madebyollin/sdxl-vae-fp16-fix",
                  torch_dtype=torch.float32  # fp32 for ONNX export
              )
              print("VAE downloaded")
              
              # Export VAE decoder to ONNX
              vae.eval()
              latent_sample = torch.randn(1, 4, 64, 64)
              torch.onnx.export(
                  vae.decoder,
                  latent_sample,
                  "dreamlite_onnx/vae_decoder.onnx",
                  input_names=["latent_sample"],
                  output_names=["image"],
                  dynamic_axes={"latent_sample": {0: "batch"}},
                  opset_version=17
              )
              print("✓ VAE decoder exported to ONNX")
          except Exception as e:
              print(f"VAE export failed: {e}")
          
          # Export a minimal text encoder stub (CLIP ViT-L/14 as proxy)
          print("Downloading text encoder (CLIP ViT-L/14)...")
          try:
              from transformers import CLIPTextModel, CLIPTokenizer
              tokenizer = CLIPTokenizer.from_pretrained("openai/clip-vit-large-patch14")
              text_encoder = CLIPTextModel.from_pretrained("openai/clip-vit-large-patch14", torch_dtype=torch.float32)
              text_encoder.eval()
              
              dummy_ids = torch.zeros((1, 77), dtype=torch.long)
              torch.onnx.export(
                  text_encoder,
                  dummy_ids,
                  "dreamlite_onnx/text_encoder.onnx",
                  input_names=["input_ids"],
                  output_names=["last_hidden_state"],
                  dynamic_axes={"input_ids": {0: "batch"}},
                  opset_version=17
              )
              tokenizer.save_pretrained("dreamlite_onnx/tokenizer")
              print("✓ Text encoder exported to ONNX")
          except Exception as e:
              print(f"Text encoder export failed: {e}")
          
          # Create model manifest
          import json
          manifest = {
              "version": "1.0",
              "model_type": "dreamlite_gemini_config",
              "components": ["text_encoder.onnx", "vae_decoder.onnx"],
              "params": {
                  "num_inference_steps": 50,
                  "guidance_scale": 7.0,
                  "image_guidance_scale": 1.5,
                  "negative_prompt": "blurry, distorted, ugly, bad anatomy, text, watermark, pixelated, low resolution",
                  "resolution": 512,
                  "vae": "sdxl-vae-fp16-fix",
                  "text_encoder": "clip-vit-large-patch14",
                  "precision": "fp16",
                  "attention_slicing": True
              },
              "note": "Gemini-config: HD VAE + CLIP encoder + DreamLite UNet for best quality"
          }
          with open("dreamlite_onnx/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print("✓ Manifest written")
          print("Available ONNX files:", os.listdir("dreamlite_onnx"))
          PYEOF

      - name: Pack DreamLite ONNX into assets
        run: |
          mkdir -p lfm25/app/src/main/assets
          if [ -d "dreamlite_onnx" ] && [ "$(ls dreamlite_onnx/*.onnx 2>/dev/null | wc -l)" -gt "0" ]; then
            cd dreamlite_onnx
            zip -r ../lfm25/app/src/main/assets/dreamlite.zip .
            cd ..
            echo "DreamLite bundled: $(du -sh lfm25/app/src/main/assets/dreamlite.zip)"
            # IMPORTANT: noCompress in build.gradle.kts stores this zip uncompressed
            # inside the APK so Android can read it directly without double-decompression.
          else
            echo "ERROR: No ONNX files in dreamlite_onnx/ — conversion step above failed"
            ls -la dreamlite_onnx/ 2>/dev/null || echo "dreamlite_onnx/ missing"
            exit 1
          fi
          ls -lh lfm25/app/src/main/assets/

      - name: Install NDK and CMake
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name "sdkmanager" | head -1)
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x lfm25/gradlew

      - name: Generate consistent signing keystore
        run: |
          # Use a fixed keystore so APK updates install over previous version
          # without requiring uninstall. Same key = same signature = update works.
          KEYSTORE_PATH="$HOME/thunder_agi.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkey -v               -keystore "$KEYSTORE_PATH"               -alias thunder_agi               -keyalg RSA -keysize 2048               -validity 10000               -storepass ThunderAGI2026!               -keypass ThunderAGI2026!               -dname "CN=Thunder AGI, OU=Thunder, O=Yassin Khashelmoos, L=Khartoum, ST=Khartoum, C=SD"
            echo "Keystore generated"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV

      - name: Build Release APK (minified + obfuscated)
        working-directory: lfm25
        run: |
          ./gradlew assembleRelease             -Pandroid.injected.signing.store.file=${{ env.KEYSTORE_PATH }}             -Pandroid.injected.signing.store.password=ThunderAGI2026!             -Pandroid.injected.signing.key.alias=thunder_agi             -Pandroid.injected.signing.key.password=ThunderAGI2026!             --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Copy APK to output
        run: |
          mkdir -p output
          # Use Gradle output directly - it already does zipalign + signing
          # DO NOT run zipalign manually after signing - it breaks the signature
          APK="lfm25/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="lfm25/app/build/outputs/apk/debug/app-debug.apk"
            echo "Using debug APK"
          fi
          cp "$APK" "output/ThunderAGI-الرعد-v3.apk"
          echo "APK size: $(du -sh output/ThunderAGI-الرعد-v3.apk)"

      - name: Verify APK is valid
        run: |
          APK="output/ThunderAGI-الرعد-v3.apk"
          # Verify it's a valid ZIP/APK
          python3 -c "
          import zipfile, sys
          try:
              with zipfile.ZipFile('$APK') as z:
                  files = z.namelist()
                  has_manifest = 'AndroidManifest.xml' in files
                  has_dex = any(f.endswith('.dex') for f in files)
                  has_lib = any(f.startswith('lib/') for f in files)
                  print(f'APK valid: manifest={has_manifest} dex={has_dex} lib={has_lib}')
                  print(f'Files: {len(files)}')
                  if not has_manifest or not has_dex:
                      print('ERROR: APK missing required components!')
                      sys.exit(1)
                  print('APK validation PASSED')
          except Exception as e:
              print(f'APK validation FAILED: {e}')
              sys.exit(1)
          "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAGI-الرعد-v3
          path: output/ThunderAGI-الرعد-v3.apk
          retention-days: 30

      - name: Show install instructions
        run: |
          echo ""
          echo "=== HOW TO INSTALL ==="
          echo "1. Download the artifact ZIP from GitHub"
          echo "2. EXTRACT the ZIP - you will find ThunderAGI-الرعد-v3.apk inside"
          echo "3. Copy ONLY the .apk file to your phone"
          echo "4. Tap the .apk file to install"
          echo "DO NOT try to install the .zip - extract it first!"
          echo "APK size: $(du -sh output/ThunderAGI-الرعد-v3.apk)"
