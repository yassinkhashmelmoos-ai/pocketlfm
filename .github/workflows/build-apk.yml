name: Build Thunder AGI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # This action removes pre-installed toolchains you don't need. yes
          tool-cache: true   # ← frees ~15-20 GB (was false)/ Python/Node are needed.
          android: true       # Frees ~14 GB (Android SDK & NDK)
          dotnet: true        # Frees ~2.7 GB
          haskell: true       # Frees ~5 GB (GHC)
          large-packages: true # Frees ~5.3 GB
          docker-images: true # Frees Docker cache
          swap-storage: true  # Frees pre-existing swap (your custom swap is separate)
      
      - name: Increase swap space (prevent OOM)
        run: |
          sudo fallocate -l 12G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=12288
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove adaptive icon overrides
        run: |
          rm -f lfm25/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          rm -f lfm25/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          echo "Adaptive icon XMLs removed"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install Pillow
          pip install "torch==2.14.1" torchvision --index-url https://download.pytorch.org/whl/cpu

          pip install --no-cache-dir \
            "transformers==4.57.3" \
            accelerate \
            onnx \
            onnxscript \
            "onnx-neural-compressor @ git+https://github.com/thiswillbeyourgithub/neural-compressor-fork.git@da405cd" \
            "onnxruntime==1.18.0" \
            "numpy<2" \
            "onnxconverter-common" \
            "datasets>=3.2.0" \
            "pyarrow>=16,<26" \
            "prettytable" \
            "schema" \
            "pandas" \
            "scikit-learn" \
            "opencv-python" \
            "deprecated" \
            "psutil" \
            "py-cpuinfo" \
            httpx

          pip uninstall -y diffusers huggingface-hub || true
          pip install --no-cache-dir --no-deps "git+https://github.com/huggingface/diffusers.git"
          pip install --no-cache-dir "huggingface-hub>=0.34.0,<1.0"

          python -c "import huggingface_hub; from packaging.version import Version; v=huggingface_hub.__version__; assert Version(v) < Version('1.0.0') and Version(v) >= Version('0.34.0'), f'hf-hub {v} not in [0.34.0, 1.0.0)'; print(f'hf-hub {v} OK')"      # FIX: added per the user's own debugging — diffusers-from-main (needed for
         
          
      # DreamLitePipeline/DreamLiteUNetModel, neither tagged in a release yet) calls
      # a few huggingface_hub APIs (resolve_revision, RevisionResolutionError,
      # get_cached_repo_tree) that the pinned huggingface-hub version above doesn't
      # have yet. This patches diffusers/utils/hub_utils.py with no-op/pass-through
      # stubs for exactly those, plus broad __getattr__ fallbacks for anything else
      # missing, so pipeline loading doesn't hard-fail on an AttributeError before
      # ever reaching the actual export code.
      - name: Patch diffusers for huggingface_hub compatibility
        run: |
          SHIM=/tmp/hub_compat_shim.py
          printf '%s\n' \
            '# diffusers-hub-compat-shim-v2' \
            'import huggingface_hub as _hfh' \
            'import huggingface_hub.errors as _hfh_err' \
            'import huggingface_hub.utils as _hfh_util' \
            '' \
            'def _make_stub(name):' \
            '    def _stub(*a, **k):' \
            '        return None' \
            '    _stub.__name__ = name' \
            '    return _stub' \
            '' \
            'if not hasattr(_hfh, "resolve_revision"):' \
            '    def _resolve_revision_stub(*a, **k):' \
            '        if "revision" in k:' \
            '            return k["revision"]' \
            '        if len(a) >= 2:' \
            '            return a[1]' \
            '        return "main"' \
            '    _hfh.resolve_revision = _resolve_revision_stub' \
            '' \
            'if not hasattr(_hfh_err, "RevisionResolutionError"):' \
            '    class RevisionResolutionError(Exception):' \
            '        pass' \
            '    _hfh_err.RevisionResolutionError = RevisionResolutionError' \
            '' \
            'if not hasattr(_hfh_util, "httpx"):' \
            '    try:' \
            '        import httpx as _httpx' \
            '        _hfh_util.httpx = _httpx' \
            '    except ImportError:' \
            '        import huggingface_hub.utils._http as _http_mod' \
            '        _hfh_util.httpx = _http_mod' \
            '' \
            'if not hasattr(_hfh, "get_cached_repo_tree"):' \
            '    def _get_cached_repo_tree_stub(*a, **k):' \
            '        return []' \
            '    _hfh.get_cached_repo_tree = _get_cached_repo_tree_stub' \
            '' \
            'if not hasattr(_hfh, "__getattr__"):' \
            '    def _hfh_getattr(name):' \
            '        return _make_stub(name)' \
            '    _hfh.__getattr__ = _hfh_getattr' \
            '' \
            'if not hasattr(_hfh_err, "__getattr__"):' \
            '    def _hfh_err_getattr(name):' \
            '        return type(name, (Exception,), {})' \
            '    _hfh_err.__getattr__ = _hfh_err_getattr' \
            '' \
            'if not hasattr(_hfh_util, "__getattr__"):' \
            '    def _hfh_util_getattr(name):' \
            '        return _make_stub(name)' \
            '    _hfh_util.__getattr__ = _hfh_util_getattr' \
            > "$SHIM"

          python3 -c '
          import importlib.util, os, sys
          spec = importlib.util.find_spec("diffusers")
          path = os.path.join(os.path.dirname(spec.origin), "utils", "hub_utils.py")
          with open(path) as f:
              text = f.read()
          if "# diffusers-hub-compat-shim-v2" in text:
              print("Already patched with v2")
              sys.exit(0)
          with open("/tmp/hub_compat_shim.py") as f:
              shim = f.read()
          if not shim.endswith("\n"):
              shim += "\n"
          with open(path, "w") as f:
              f.write(shim + text)
          print("Patched " + path)
          '

      - name: Generate mipmap icon sizes
        run: |
          python3 << 'PYEOF'
          from PIL import Image
          import os
          src = "lfm25/app/src/main/assets/app_icon_source.jpg"
          if not os.path.exists(src):
              print("WARNING: app_icon_source.jpg not found, skipping icons")
          else:
              sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
              img = Image.open(src).convert("RGBA")
              for name, size in sizes.items():
                  d = f"lfm25/app/src/main/res/mipmap-{name}"
                  os.makedirs(d, exist_ok=True)
                  r = img.resize((size,size), Image.LANCZOS)
                  r.save(f"{d}/ic_launcher.webp","WEBP")
                  r.save(f"{d}/ic_launcher_round.webp","WEBP")
                  print(f"✓ {name} {size}x{size}")
          PYEOF

      - name: Download LFM2.5-VL model
        run: |
          mkdir -p lfm25/app/src/main/assets
          wget -q --show-progress \
            "https://huggingface.co/LiquidAI/LFM2.5-VL-450M-GGUF/resolve/main/LFM2.5-VL-450M-Q4_K_M.gguf" \
            -O lfm25/app/src/main/assets/model.gguf
          echo "LFM model: $(du -sh lfm25/app/src/main/assets/model.gguf)"

      # FIX: this entire step used to silently abandon DreamLite and export a
      # plain full-size SD1.5 UNet + mismatched SDXL VAE instead (see the old
      # comments this replaces). This version actually loads DreamLite-base's
      # real UNet and Qwen3-VL-2B-Instruct's real text encoder (per the user's
      # explicit instruction to follow Gemini's component choices), grounded in
      # the actual DreamLitePipeline/scheduler source read directly from the
      # installed diffusers package rather than guessed — exact prompt template,
      # exact drop-index, exact flow-matching math, exact CFG formula. See the
      # per-section comments below for what's confirmed vs. best-effort.
      #
      # Known real risk, stated plainly rather than hidden: exporting a 2B-
      # parameter model on a standard GitHub-hosted runner (~7GB RAM) is tight.
      # The text-encoder export is wrapped so if it fails (OOM, timeout), the
      # UNet + VAE (the part closest to validated by community precedent) still
      # get bundled, and ImageGenerator.kt's existing per-session loading guard
      # (see FIX comments there) degrades to the online fallback rather than
      # crashing if text_encoder.onnx ends up missing.
      - name: Export ONNX models for offline image generation
        run: |
          python3 << 'PYEOF'
          import os, sys, gc, torch, json
          print(f"torch version: {torch.__version__}")
          print("=== ONNX Export Pipeline (DreamLite-base + Qwen3-VL-2B + SDXL-VAE) ===")

          from diffusers import AutoencoderKL, DreamLiteUNetModel
          from transformers import AutoTokenizer
          import numpy as np

          os.makedirs("dreamlite_onnx", exist_ok=True)
          manifest = {"version": "3.0", "components": [], "params": {}}

          # ── 0. Load DreamLite-base's UNet directly (not the full pipeline) ────────
          # FIX: the exit-143 (SIGTERM, almost certainly the runner's OOM handling)
          # from the previous run happened right after "Loading pipeline components:
          # 6/6" — i.e. inside DreamLitePipeline.from_pretrained() itself.
          # DiffusionPipeline.from_pretrained() loads *every* registered component
          # before returning, which for this pipeline means a full fp32 copy of the
          # 2B-parameter Qwen3-VL text encoder gets loaded as pipe.text_encoder —
          # on top of the *separate* Qwen3-VL load this script does a few lines
          # below for the actual export. That's two full 2B-parameter models in
          # memory at once, ~16GB+ in fp32, against a runner with ~7GB RAM; the
          # earlier del pipe/gc.collect() came too late, since the peak already
          # happened inside from_pretrained() before that line could ever run.
          #
          # Fix: load only DreamLiteUNetModel directly via its own subfolder (the
          # standard diffusers convention — every component's subfolder matches its
          # model_index.json attribute name) instead of the whole pipeline. This
          # never touches DreamLite's own bundled text_encoder at all — this script
          # replaces it with a standalone Qwen3-VL load further down regardless, so
          # that copy was always redundant, not just mistimed.
          print("\n[0/3] Loading carlofkl/DreamLite-base's UNet only (not the full pipeline)...")
          unet = DreamLiteUNetModel.from_pretrained(
              "carlofkl/DreamLite-base", revision="diffusers", subfolder="unet", dtype=torch.float32)
          unet.eval()
          cross_attention_dim = unet.config.cross_attention_dim
          if isinstance(cross_attention_dim, (list, tuple)):
              cross_attention_dim = cross_attention_dim[-1]
          print(f"  UNet cross_attention_dim (expected text hidden size): {cross_attention_dim}")
          print(f"  UNet in_channels: {unet.config.in_channels}")
          print("  DIAG:", unet.config.encoder_hid_dim, unet.config.encoder_hid_dim_type)
          print("  DIAG:", hasattr(unet, "encoder_hid_proj"), getattr(unet, "encoder_hid_proj", None))

          # FIX: tokenizer loaded straight from the canonical Qwen3-VL repo rather
          # than DreamLite-base's bundled copy — it's the same tokenizer either way
          # (DreamLite's *is* Qwen3-VL's), and this avoids depending on a subfolder
          # name for it that wasn't directly confirmed, on top of being a tiny,
          # cheap download regardless.
          tokenizer = AutoTokenizer.from_pretrained("Qwen/Qwen3-VL-2B-Instruct")
          gc.collect()

          # Prompt-encoding constants copied verbatim from DreamLitePipeline's own
          # __init__ (self.prompt_template_encode_generate / _start_idx) — these are
          # empirically pinned by the authors, not derivable from the model alone.
          manifest["params"]["prompt_template"] = (
              "<|im_start|>system\nDescribe the image by detailing the color, shape, size, texture, "
              "quantity, text, spatial relationships of the objects and background:<|im_end|>\n"
              "<|im_start|>user\n{}<|im_end|>\n<|im_start|>assistant\n"
          )
          manifest["params"]["prompt_template_drop_idx"] = 34

          # ── 1. VAE decoder + encoder (madebyollin/sdxl-vae-fp16-fix) ──────────
          # FIX: per the user's explicit direction, swap DreamLite's default
          # AutoencoderTiny (small/blurry, "deep-fried" per Gemini) for this full
          # SDXL VAE. IMPORTANT: SDXL's scaling_factor (0.13025) and shift_factor
          # differ from SD1.5's 0.18215 — the manifest carries the REAL values read
          # from this VAE's own config, not a hardcoded assumption, and
          # ImageGenerator.kt must read them from there (see its FIX comment).
          print("\n[1/3] VAE encoder + decoder (madebyollin/sdxl-vae-fp16-fix)...")
          vae = AutoencoderKL.from_pretrained(
              "madebyollin/sdxl-vae-fp16-fix",
              dtype=torch.float32)
          vae.eval()
          manifest["params"]["vae_scaling_factor"] = float(vae.config.scaling_factor)
          manifest["params"]["vae_shift_factor"] = float(getattr(vae.config, "shift_factor", 0.0) or 0.0)
          manifest["params"]["latent_channels"] = int(vae.config.latent_channels)
          try:
              dummy = torch.randn(1, 4, 64, 64)
              torch.onnx.export(
                  vae.decoder,
                  dummy,
                  "dreamlite_onnx/vae_decoder.onnx",
                  input_names=["latent_sample"],
                  output_names=["image"],
                  dynamic_axes={"latent_sample": {0: "batch"}},
                  opset_version=14)  # opset 14 avoids scaled_dot_product issues
              print(f"✓ VAE decoder: {os.path.getsize('dreamlite_onnx/vae_decoder.onnx')//1024//1024} MB")
          except Exception as e:
              print(f"✗ VAE decoder export failed: {e}")

          # FIX: the old workflow never exported a VAE *encoder* at all — only the
          # decoder. That made image editing impossible (no way to turn the source
          # image into latents). AutoencoderKL.encode() returns a
          # DiagonalGaussianDistribution, not a plain tensor, so it needs a thin
          # wrapper to be ONNX-exportable; .mode() (not .sample()) is used so
          # encoding is deterministic.
          class VaeEncoderWrapper(torch.nn.Module):
              def __init__(self, vae):
                  super().__init__()
                  self.vae = vae
              def forward(self, pixel_values):
                  return self.vae.encode(pixel_values).latent_dist.mode()
          try:
              dummy_img = torch.randn(1, 3, 512, 512)
              with torch.no_grad():
                  torch.onnx.export(
                      VaeEncoderWrapper(vae),
                      dummy_img,
                      "dreamlite_onnx/vae_encoder.onnx",
                      input_names=["pixel_values"],
                      output_names=["latent_sample"],
                      dynamic_axes={"pixel_values": {0: "batch", 2: "height", 3: "width"}},
                      opset_version=14)
              print(f"✓ VAE encoder: {os.path.getsize('dreamlite_onnx/vae_encoder.onnx')//1024//1024} MB")
          except Exception as e:
              print(f"✗ VAE encoder export failed: {e}")
          del vae
          gc.collect()

          # ── 2. UNet (DreamLite-base's real DreamLiteUNetModel) ────────────────
          # FIX: this used to silently substitute a full SD1.5 UNet (~3.4GB,
          # external-data weights the old copy step never bundled — the root cause
          # of the crash this whole investigation started from) paired with a
          # text encoder it was never trained with. This exports DreamLite's own
          # 0.39B UNet, loaded via DreamLiteUNetModel (a real UNet2DConditionModel
          # subclass, confirmed present in diffusers main) rather than the generic
          # parent class that failed before.
          #
          # Inputs mirror DreamLitePipeline.__call__ exactly, read directly above:
          # double-width `sample` (latents concatenated with a same-shape zero
          # tensor along the width axis — DreamLite always expects this "diptych"
          # layout, even for plain text-to-image with no real second image), plus
          # `encoder_attention_mask` and `added_cond_kwargs={"time_ids": ...}`
          # flattened into a plain `time_ids` input for ONNX (dict kwargs aren't
          # ONNX-exportable). 1024x1024 output → 128x128 latents each side, 256
          # wide combined, matching DreamLite's native resolution.
          print("\n[2/3] UNet (carlofkl/DreamLite-base)...")
          unet_exported = False
          try:
              from torch.export import Dim

              class UNetWrapper(torch.nn.Module):
                  def __init__(self, unet):
                      super().__init__()
                      self.unet = unet
                  def forward(self, sample, timestep, encoder_hidden_states, encoder_attention_mask, time_ids):
                      return self.unet(
                          sample, timestep=timestep,
                          encoder_hidden_states=encoder_hidden_states,
                          encoder_attention_mask=encoder_attention_mask,
                          added_cond_kwargs={"time_ids": time_ids},
                          return_dict=False)[0]

              latent_ch = manifest["params"]["latent_channels"]
              dummy_sample = torch.randn(2, latent_ch, 128, 256)
              dummy_t = torch.tensor([500.0, 500.0])
              dummy_hidden = torch.randn(2, 48, 2048)
              dummy_enc_mask = torch.ones(2, 48, dtype=torch.long)
              dummy_time_ids = torch.tensor([[1024.0, 1024.0], [1024.0, 1024.0]])

              batch = Dim("batch", min=1)
              seq = Dim("seq", min=1)
              dynamic_shapes = {
                  "sample":                {0: batch},
                  "timestep":              {0: batch},
                  "encoder_hidden_states": {0: batch, 1: seq},
                  "encoder_attention_mask":{0: batch, 1: seq},
                  "time_ids":              {0: batch},
              }

              with torch.no_grad():
                  torch.onnx.export(
                      UNetWrapper(unet),
                      (dummy_sample, dummy_t, dummy_hidden, dummy_enc_mask, dummy_time_ids),
                      "dreamlite_onnx/unet.onnx",
                      input_names=["sample", "timestep", "encoder_hidden_states",
                                   "encoder_attention_mask", "time_ids"],
                      output_names=["out_sample"],
                      dynamic_axes={
                          "sample":                {0: "batch"},
                          "timestep":              {0: "batch"},
                          "encoder_hidden_states": {0: "batch", 1: "sequence"},
                          "encoder_attention_mask":{0: "batch", 1: "sequence"},
                          "time_ids":              {0: "batch"},
                      },
                      opset_version=17,
                      dynamo=False,
                      autograd_inlining=False,
                  )
              unet_exported = True
              print(f"✓ DreamLite UNet: {os.path.getsize('dreamlite_onnx/unet.onnx')//1024//1024} MB")
              import onnxruntime as ort
              _sess = ort.InferenceSession("dreamlite_onnx/unet.onnx", providers=["CPUExecutionProvider"])
              for _i in _sess.get_inputs():
                  print("  DIAG:", _i.name, _i.shape)
              del _sess
              del unet
          except Exception as e:
              print(f"✗ DreamLite UNet export failed: {e}")
          # ── 4. Tokenizer + manifest ───────────────────────────────────────────
          # FIX: the Android app had no real tokenizer at all — ImageGenerator.kt's
          # tokenize() was a ~35-word hardcoded dictionary plus a hash fallback for
          # everything else (confirmed still true on inspection; semantically
          # meaningless for the vast majority of real prompts). Qwen3-VL ships a
          # real HF "fast tokenizer" as a single tokenizer.json (byte-level BPE);
          # bundling that file lets the Kotlin side do real tokenization instead of
          # another placeholder. See the matching FIX in ImageGenerator.kt.
          print("\n[3/3] Tokenizer...")
          try:
              tokenizer.save_pretrained("dreamlite_onnx/tokenizer_dir")
              import shutil
              shutil.copy("dreamlite_onnx/tokenizer_dir/tokenizer.json", "dreamlite_onnx/tokenizer.json")
              print(f"✓ tokenizer.json: {os.path.getsize('dreamlite_onnx/tokenizer.json')//1024} KB")
          except Exception as e:
              print(f"✗ Tokenizer export failed: {e}")

          # FIX: merges into the manifest built up during each component's export
          # above (real vae_scaling_factor/shift_factor/latent_channels/
          # text_hidden_size/prompt_template/drop_idx) instead of overwriting it
          # with a fresh dict — the old code discarded all of that. num_inference_
          # steps / guidance_scale / negative_prompt / attention_slicing are the
          # exact parameters requested, from Gemini's analysis, rather than this
          # pipeline's own defaults (30 steps / CFG 3.5) — noted here since it's a
          # real, deliberate departure from the authors' tuned values, not an
          # oversight.
          onnx_files = [f for f in os.listdir("dreamlite_onnx") if f.endswith(".onnx")]
          manifest["components"] = onnx_files
          manifest["has_vae_decoder"] = "vae_decoder.onnx"  in onnx_files
          manifest["has_vae_encoder"] = "vae_encoder.onnx"  in onnx_files
          manifest["has_encoder"]      = "text_encoder.onnx" in onnx_files
          manifest["has_edit_encoder"] = "text_encoder_edit.onnx" in onnx_files
          manifest["has_unet"]        = "unet.onnx"          in onnx_files
          manifest["has_tokenizer"]   = os.path.exists("dreamlite_onnx/tokenizer.json")
          manifest["params"].update({
              "num_inference_steps": 50,
              "guidance_scale": 7.0,
              "negative_prompt": "blurry, distorted, ugly, bad anatomy, text, watermark, pixelated, low resolution",
              "attention_slicing": False,
              "resolution": 1024,
              "scheduler": "flow_match_euler_discrete",
              "scheduler_shift": {"base_image_seq_len": 256, "max_image_seq_len": 4096,
                                   "base_shift": 0.5, "max_shift": 1.16},
          })
          with open("dreamlite_onnx/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)

          print("\n=== Export summary ===")
          for f in sorted(os.listdir("dreamlite_onnx")):
              size = os.path.getsize(f"dreamlite_onnx/{f}")
              print(f"  {f}: {size//1024//1024} MB" if size > 1024*1024 else f"  {f}: {size} B")
          PYEOF
     
      - name: Convert UNet to fp16 (halve size, keep I/O fp32)
        run: |
          python3 << 'PYEOF'
          import os, onnx
          from onnxconverter_common import float16

          src = "dreamlite_onnx/unet.onnx"
          if not os.path.exists(src):
              print(f"⚠ {src} not found — skipping")
          else:
              size_before = os.path.getsize(src) // 1024 // 1024
              model = onnx.load(src, load_external_data=False)
              model_fp16 = float16.convert_float_to_float16(
                  model, keep_io_types=True, disable_shape_infer=True)
              onnx.save(model_fp16, src)
              size_after = os.path.getsize(src) // 1024 // 1024
              print(f"✓ UNet fp16: {size_before} MB → {size_after} MB")
          PYEOF
          
      # FIX: exit 137 (SIGKILL/OOM) — the text encoder export used to run inside
      # the same Python process as the VAE+UNet export above. Even after that
      # earlier step's own fixes (UNet-only load, no full pipeline), loading a
      # 2B-parameter model and quantizing it in a process that had already
      # handled VAE+UNet still peaked past this runner's ~7GB. A brand new step
      # is a brand new process — the OS fully reclaims whatever the previous
      # step used, which `del`/`gc.collect()` within one process cannot do for
      # every allocation. Two more changes beyond isolation, both required:
      # fp16 instead of bf16 (quantize_dynamic doesn't quantize bf16 tensors —
      # elem_type 16 — so a bf16 export was silently skipping quantization and
      # leaving a multi-GB unquantized file resident) and
      # use_external_data_format=True (quantize_dynamic's default keeps the
      # whole model in memory twice — original and quantized copy; streaming
      # from disk avoids that, and is close to mandatory for a model near
      # ONNX's 2GB protobuf message limit either way).
      - name: Export text encoder + quantize (isolated process)
        run: |
          python3 << 'PYEOF'
          import os, gc, json, torch

          def merge_manifest(extra):
              with open("dreamlite_onnx/manifest.json") as f:
                  m = json.load(f)
              m["params"].update(extra)
              files = [f for f in os.listdir("dreamlite_onnx") if f.endswith(".onnx")]
              m["components"] = files
              m["has_encoder"]      = "text_encoder.onnx" in files
              m["has_edit_encoder"] = "text_encoder_edit.onnx" in files
              with open("dreamlite_onnx/manifest.json", "w") as f:
                  json.dump(m, f, indent=2)

          from transformers import Qwen3VLForConditionalGeneration
          from onnxruntime.quantization import quantize_dynamic, QuantType

          # ── [1/2] Text encoder (generate-mode: text only) ──────────────────
          # Same encode_prompt() logic as before (output_hidden_states=True,
          # hidden_states[-1], prompt_template_drop_idx=34 applied on the
          # Kotlin side) — only the process isolation and dtype changed here.
          print("[1/2] Text encoder (Qwen/Qwen3-VL-2B-Instruct, fp16)...")
          qwen = Qwen3VLForConditionalGeneration.from_pretrained(
              "Qwen/Qwen3-VL-2B-Instruct", dtype=torch.float32)
          qwen.eval()
          hidden = qwen.config.text_config.hidden_size
          print(f"  Qwen3-VL-2B text hidden_size: {hidden}")

          class TextEncoderWrapper(torch.nn.Module):
              def __init__(self, model):
                  super().__init__()
                  self.model = model
              def forward(self, input_ids, attention_mask):
                  # Text-only position_ids: cumsum of attention_mask - 1.
                  # Passing position_ids directly means get_rope_index is never
                  # called, so rope_deltas is never computed and never baked.
                  position_ids = attention_mask.long().cumsum(-1) - 1
                  position_ids = position_ids.masked_fill(attention_mask == 0, 1)
                  position_ids = position_ids.unsqueeze(0).expand(3, -1, -1)

                  out = self.model(
                      input_ids=input_ids,
                      attention_mask=attention_mask,
                      position_ids=position_ids,
                      output_hidden_states=True,
                      use_cache=False,
                  )
                  return out.hidden_states[-1]

          dummy_ids  = torch.randint(0, 1000, (2, 48), dtype=torch.long)
          dummy_mask = torch.ones((2, 48), dtype=torch.long)

          from torch.export import Dim
          batch = Dim("batch", min=1)
          seq   = Dim("seq", min=1)
          patches = Dim("patches", min=1)
          with torch.no_grad():
              torch.onnx.export(
                  TextEncoderWrapper(qwen), (dummy_ids, dummy_mask),
                  "dreamlite_onnx/text_encoder_fp16.onnx",
                  input_names=["input_ids", "attention_mask"],
                  output_names=["last_hidden_state"],
                  dynamo=True,
                  dynamic_shapes={
                      "input_ids":         {0: batch, 1: seq},
                      "attention_mask":    {0: batch, 1: seq},
                      
                  },
                  opset_version=18,
              )
          del qwen
          gc.collect()
          print(f"  fp16 export: {os.path.getsize('dreamlite_onnx/text_encoder_fp16.onnx')//1024//1024} MB")

          
          merge_manifest({"text_hidden_size": int(hidden)})

          # ── [2/2] Edit-mode (vision) encoder ────────────────────────────────
          # HONEST FLAG (unchanged from the previous pass — this step's fix is
          # about memory, not about this remaining uncertainty): the patch-
          # flattening order in QwenVisionPreprocessor.kt is transliterated from
          # Qwen2VLImageProcessor._preprocess, reused by Qwen3-VL. patch_size=14,
          # temporal_patch_size=2, merge_size=2, and the OPENAI_CLIP mean/std
          # below are independently confirmed (Qwen2-VL-2B's own
          # preprocessor_config.json, multiple independent Qwen2-VL source
          # mirrors). The exact 9D reshape + transpose(0,3,6,4,7,2,1,5,8) is also
          # confirmed against several independent copies of the real
          # Qwen2VLImageProcessor source. What's NOT independently confirmed:
          # that Qwen3-VL-2B-Instruct's checkpoint uses identical values (very
          # likely — standard across the Qwen-VL family — but unverified against
          # this specific model's actual config). Wrapped in try/except so a
          # failure here doesn't take down generate-mode, which doesn't need any
          # of this.
          
          patch_size, temporal_patch_size, merge_size = 16, 2, 2
          merge_manifest({
                  "vision_patch_size": patch_size,
                  "vision_temporal_patch_size": temporal_patch_size,
                  "vision_merge_size": merge_size,
                  "vision_image_mean": [0.48145466, 0.4578275, 0.40821073],
                  "vision_image_std":  [0.26862954, 0.26130258, 0.27577711],
          })
     
          print("\n=== Text encoder step summary ===")
          for f in sorted(os.listdir("dreamlite_onnx")):
              p = f"dreamlite_onnx/{f}"
              s = os.path.getsize(p)
              print(f"  {f}: {s//1024//1024} MB" if s > 1024*1024 else f"  {f}: {s} B")
          PYEOF
      
      
      - name: Export edit-mode text encoder (isolated, non-fatal)
        continue-on-error: true
        run: |
          python3 << 'PYEOF'
          import os, gc, json, torch

          def merge_manifest(extra):
              with open("dreamlite_onnx/manifest.json") as f:
                  m = json.load(f)
              m["params"].update(extra)
              files = [f for f in os.listdir("dreamlite_onnx") if f.endswith(".onnx")]
              m["components"] = files
              m["has_edit_encoder"] = "text_encoder_edit_fp16.onnx" in files or "text_encoder_edit.onnx" in files
              with open("dreamlite_onnx/manifest.json", "w") as f:
                  json.dump(m, f, indent=2)

          from transformers import Qwen3VLForConditionalGeneration, AutoTokenizer

          print("[1/1] Edit-mode text encoder...")
          qwen_vision = Qwen3VLForConditionalGeneration.from_pretrained(
              "Qwen/Qwen3-VL-2B-Instruct", dtype=torch.float32)
          qwen_vision.eval()

          import types
          import torch.nn.functional as F
          from transformers.models.qwen3_vl.modeling_qwen3_vl import (
              apply_rotary_pos_emb_vision,
              Qwen3VLModel,
          )

          def _patched_vision_attn_forward(self, hidden_states, cu_seqlens=None,
                                            position_embeddings=None, **kwargs):
              seq_length = hidden_states.shape[0]
              q, k, v = (
                  self.qkv(hidden_states)
                  .reshape(seq_length, 3, self.num_heads, self.head_dim)
                  .permute(1, 0, 2, 3)
                  .unbind(0)
              )
              cos, sin = position_embeddings
              q, k = apply_rotary_pos_emb_vision(q, k, cos, sin)
              q = q.transpose(0, 1).unsqueeze(0)
              k = k.transpose(0, 1).unsqueeze(0)
              v = v.transpose(0, 1).unsqueeze(0)
              attn_output = F.scaled_dot_product_attention(
                  q, k, v, attn_mask=None, dropout_p=0.0, is_causal=False)
              attn_output = attn_output.transpose(1, 2).reshape(seq_length, -1).contiguous()
              return self.proj(attn_output)

          vision_tower = qwen_vision.model.visual
          for blk in vision_tower.blocks:
              blk.attn.forward = types.MethodType(_patched_vision_attn_forward, blk.attn)

          FIXED_GRID = torch.tensor([[1, 36, 36]], dtype=torch.long)

          with torch.no_grad():
              pos_embeds_fixed = vision_tower.fast_pos_embed_interpolate(FIXED_GRID)
              rotary_fixed = vision_tower.rot_pos_emb(FIXED_GRID)

          def _fixed_pos_embed(self, grid_thw):
              return pos_embeds_fixed

          def _fixed_rotary(self, grid_thw):
              return rotary_fixed

          vision_tower.fast_pos_embed_interpolate = _fixed_pos_embed.__get__(vision_tower)
          vision_tower.rot_pos_emb = _fixed_rotary.__get__(vision_tower)

          _ORIGINAL_GET_PLACEHOLDER = Qwen3VLModel.get_placeholder_mask
          def _patched_get_placeholder_mask(self, *args, **kwargs):
              kwargs["image_features"] = None
              return _ORIGINAL_GET_PLACEHOLDER(self, *args, **kwargs)
          Qwen3VLModel.get_placeholder_mask = _patched_get_placeholder_mask

          from transformers.models.qwen3_vl.modeling_qwen3_vl import Qwen3VLTextModel
          def _patched_deepstack_process(self, hidden_states, visual_pos_masks, visual_embeds):
              return hidden_states
          Qwen3VLTextModel._deepstack_process = _patched_deepstack_process

          _tok = AutoTokenizer.from_pretrained("Qwen/Qwen3-VL-2B-Instruct")
          image_pad_id    = _tok.convert_tokens_to_ids("<|image_pad|>")
          vision_start_id = _tok.convert_tokens_to_ids("<|vision_start|>")
          vision_end_id   = _tok.convert_tokens_to_ids("<|vision_end|>")

          num_image_tokens = (36 // 2) * (36 // 2)
          text_ids = _tok.encode("describe this image", add_special_tokens=False)

          dummy_vis_ids = torch.tensor([[
              vision_start_id,
              *([image_pad_id] * num_image_tokens),
              vision_end_id,
              *text_ids,
          ]], dtype=torch.long)
          dummy_vis_mask = torch.ones_like(dummy_vis_ids)

          
          patch_size, temporal_patch_size, merge_size = 16, 2, 2
          grid_h = grid_w = 36
          n_patches = grid_h * grid_w
          dummy_pixel_values = torch.randn(
              n_patches, 3 * temporal_patch_size * patch_size * patch_size)

          class VisionTextEncoderWrapper(torch.nn.Module):
              def __init__(self, model):
                  super().__init__()
                  self.model = model

              def forward(self, input_ids, attention_mask, pixel_values):
                  seq_len = input_ids.shape[1]
                  device = input_ids.device

                  num_image = (36 // 2) * (36 // 2)  # 324
                  merged_w = 36 // 2                # 18
                  merged_h = 36 // 2                # 18

                  # Layout: [vision_start] + [image_pad × 324] + [vision_end + text]
                  tail_len = seq_len - num_image - 1  # -1 for vision_start

                  i = torch.arange(num_image, device=device)
                  img_t = torch.ones(num_image, dtype=torch.long, device=device)   # 1, not 0
                  img_h = i // merged_w + 1                                       # +1 offset
                  img_w = i % merged_w + 1                                        # +1 offset

                  start = torch.zeros(1, dtype=torch.long, device=device)
                  tail = torch.arange(tail_len, device=device) + merged_h + 1

                  pos_t = torch.cat([start, img_t, tail], dim=0).unsqueeze(0).unsqueeze(0)
                  pos_h = torch.cat([start, img_h, tail], dim=0).unsqueeze(0).unsqueeze(0)
                  pos_w = torch.cat([start, img_w, tail], dim=0).unsqueeze(0).unsqueeze(0)
                  position_ids = torch.cat([pos_t, pos_h, pos_w], dim=0)  # [3, 1, seq_len]

                  out = self.model(
                      input_ids=input_ids,
                      attention_mask=attention_mask,
                      pixel_values=pixel_values,
                      image_grid_thw=FIXED_GRID,
                      position_ids=position_ids,
                      output_hidden_states=True,
                      use_cache=False,
                  )
                  return out.hidden_states[-1]

          from torch.export import Dim
          batch = Dim("batch", min=1)
          seq   = Dim("seq", min=1)

          with torch.no_grad():
              torch.onnx.export(
                  VisionTextEncoderWrapper(qwen_vision),
                  (dummy_vis_ids, dummy_vis_mask, dummy_pixel_values),
                  "dreamlite_onnx/text_encoder_edit_fp16.onnx",
                  input_names=["input_ids", "attention_mask", "pixel_values"],
                  output_names=["last_hidden_state"],
                  dynamo=True,
                  dynamic_shapes={
                      "input_ids":      {0: batch, 1: seq},
                      "attention_mask": {0: batch, 1: seq},
                      "pixel_values":   {},
                  },
                  opset_version=18,
              )
          
          # ── DIAGNOSTIC: compare (a) manual pos_ids vs get_rope_index,
          #                  (b) patched forward vs unpatched forward ──
          try:
              # (a) Does our manual position_ids formula match Qwen's real one?
              with torch.no_grad():
                  ref_pos_ids, _ = Qwen3VLModel.get_rope_index(
                      qwen_vision.model,
                      input_ids=dummy_vis_ids,
                      image_grid_thw=FIXED_GRID,
                      attention_mask=dummy_vis_mask,
                  )
                  # Recompute manual formula using same logic as wrapper
                  seq_len = dummy_vis_ids.shape[1]
                  num_image = (36 // 2) * (36 // 2)
                  merged_w = 36 // 2
                  merged_h = 36 // 2
                  tail_len = seq_len - num_image - 1
                  device = dummy_vis_ids.device
                  i = torch.arange(num_image, device=device)
                  img_t = torch.ones(num_image, dtype=torch.long, device=device)   # 1, not 0
                  img_h = i // merged_w + 1                                       # +1 offset
                  img_w = i % merged_w + 1                                        # +1 offset
                  start = torch.zeros(1, dtype=torch.long, device=device)
                  tail = torch.arange(tail_len, device=device) + merged_h + 1
                  pos_t = torch.cat([start, img_t, tail], dim=0).unsqueeze(0).unsqueeze(0)
                  pos_h = torch.cat([start, img_h, tail], dim=0).unsqueeze(0).unsqueeze(0)
                  pos_w = torch.cat([start, img_w, tail], dim=0).unsqueeze(0).unsqueeze(0)
                  manual_pos_ids = torch.cat([pos_t, pos_h, pos_w], dim=0)

              pos_diff = (ref_pos_ids.float() - manual_pos_ids.float()).abs()
              print("=" * 60)
              print("DIAG A: position_ids comparison")
              print(f"  ref shape:    {tuple(ref_pos_ids.shape)}")
              print(f"  manual shape: {tuple(manual_pos_ids.shape)}")
              if ref_pos_ids.shape == manual_pos_ids.shape:
                  print(f"  max abs diff: {pos_diff.max().item():.4f}")
                  print(f"  mean abs diff: {pos_diff.mean().item():.4f}")
                  # Find first mismatch
                  nonzero = pos_diff.nonzero()
                  if len(nonzero) > 0:
                      first = nonzero[0].tolist()
                      print(f"  first mismatch at [T/H/W={first[0]}, batch={first[1]}, seq={first[2]}]")
                      idx = first[2]
                      print(f"    ref[{first[0]},{first[1]},{idx}]  = {ref_pos_ids[first[0],first[1],idx].item()}")
                      print(f"    manual[{first[0]},{first[1]},{idx}] = {manual_pos_ids[first[0],first[1],idx].item()}")
                      print(f"    dummy_vis_ids at {idx}: {dummy_vis_ids[0, idx].item()}")
              else:
                  print(f"  ✗ shape mismatch: {ref_pos_ids.shape} vs {manual_pos_ids.shape}")

              # (b) Does the patched model match the unpatched model?
              # Restore original methods temporarily for reference
              with torch.no_grad():
                  patched_out = qwen_vision(
                      input_ids=dummy_vis_ids, attention_mask=dummy_vis_mask,
                      pixel_values=dummy_pixel_values, image_grid_thw=FIXED_GRID,
                      position_ids=manual_pos_ids,
                      output_hidden_states=True, use_cache=False,
                  ).hidden_states[-1].float()

              print("=" * 60)
              print("DIAG B: reference output stats (patched model)")
              print(f"  patched_out mean: {patched_out.mean().item():.4f}")
              print(f"  patched_out std:  {patched_out.std().item():.4f}")
              print(f"  patched_out min:  {patched_out.min().item():.4f}")
              print(f"  patched_out max:  {patched_out.max().item():.4f}")

              # ONNX output
              import onnxruntime as ort, numpy as np
              sess = ort.InferenceSession(
                  "dreamlite_onnx/text_encoder_edit_fp16.onnx",
                  providers=["CPUExecutionProvider"])
              ort_out = sess.run(None, {
                  "input_ids": dummy_vis_ids.numpy(),
                  "attention_mask": dummy_vis_mask.numpy(),
                  "pixel_values": dummy_pixel_values.numpy(),
              })[0]

              print("=" * 60)
              print("DIAG C: ONNX output stats")
              print(f"  ort_out mean: {ort_out.mean().item():.4f}")
              print(f"  ort_out std:  {ort_out.std().item():.4f}")
              print(f"  ort_out min:  {ort_out.min().item():.4f}")
              print(f"  ort_out max:  {ort_out.max().item():.4f}")
              print(f"  max abs diff (patched PyTorch vs ONNX): {np.abs(patched_out.numpy() - ort_out).max():.4f}")
              print("=" * 60)
          except Exception as ve:
              import traceback
              traceback.print_exc()
              print(f"  DIAGNOSTIC ERROR: {ve}")
              
          del qwen_vision
          gc.collect()
          print(f"✓ text_encoder_edit_fp16.onnx: {os.path.getsize('dreamlite_onnx/text_encoder_edit_fp16.onnx')//1024//1024} MB")

          merge_manifest({
              "vision_patch_size": 16,
              "vision_temporal_patch_size": 2,
              "vision_merge_size": 2,
              "vision_image_mean": [0.48145466, 0.4578275, 0.40821073],
              "vision_image_std":  [0.26862954, 0.26130258, 0.27577711],
              "vision_grid_h": 36,
              "vision_grid_w": 36,
          })
          
          PYEOF
          
      - name: Prepare SmoothQuant calibration data (128 samples)
        run: |
          python3 << 'PYEOF'
          import os, torch
          from datasets import load_dataset
          from transformers import AutoProcessor
          from PIL import Image
          import io

          os.makedirs("calibration_data", exist_ok=True)
          processor = AutoProcessor.from_pretrained("Qwen/Qwen3-VL-2B-Instruct")

          # Load 128 samples from Flickr30k
          ds = load_dataset("lmms-lab/flickr30k", split="test", streaming=True)
          ds = ds.shuffle(seed=42).take(128)

          for i, sample in enumerate(ds):
              image = sample["image"]  # PIL Image
              caption = sample["caption"][0] if isinstance(sample["caption"], list) else sample["caption"]

              # Build Qwen3-VL chat template
              messages = [{
                  "role": "user",
                  "content": [
                      {"type": "image"},
                      {"type": "text", "text": caption},
                  ],
              }]
              text = processor.apply_chat_template(messages, tokenize=False, add_generation_prompt=True)
              inputs = processor(text=[text], images=[image], return_tensors="pt", padding=True)

              # Save tensors
              torch.save({
                  "input_ids": inputs["input_ids"].squeeze(0),
                  "attention_mask": inputs["attention_mask"].squeeze(0),
                  "pixel_values": inputs["pixel_values"].squeeze(0),
                  "image_grid_thw": inputs["image_grid_thw"].squeeze(0),
              }, f"calibration_data/sample_{i:03d}.pt")

          print(f"✓ Saved {len(os.listdir('calibration_data'))} calibration samples")
          PYEOF
     
