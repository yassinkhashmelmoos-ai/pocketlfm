      - name: Quantize generate-mode text encoder with SmoothQuant
        env:
          TMPDIR: /home/runner/work/_temp  # ← Redirect temp files to real disk
        run: |
          python3 << 'PYEOF'
          import os, gc, json
          import torch
          from onnx_neural_compressor.quantization import quantize, config
          from onnx_neural_compressor import data_reader
          from onnxruntime.quantization import CalibrationMethod
          
          src = "dreamlite_onnx/text_encoder_fp16.onnx"
          dst = "dreamlite_onnx/text_encoder.onnx"

          if not os.path.exists(src):
              print(f"⚠ {src} not found — skipping")
              raise SystemExit(0)

          # Calibration reader: v1.0 requires get_next() and rewind()
          class CalibReader(data_reader.CalibrationDataReader):
              def __init__(self, folder):
                  self.files = sorted(
                      os.path.join(folder, f)
                      for f in os.listdir(folder)
                      if f.endswith(".pt")
                  )
                  self.iter_next = iter(self.files)

              def get_next(self):
                  file = next(self.iter_next, None)
                  if file is None:
                      return None
                  d = torch.load(file)
                  return {
                      "input_ids": d["input_ids"].numpy().reshape(1, -1),
                      "attention_mask": d["attention_mask"].numpy().reshape(1, -1),
                  }

              def rewind(self):
                  self.iter_next = iter(self.files)

          print("[1/1] SmoothQuant + static INT8 quantization (alpha=0.5)...")

          qconfig = config.StaticQuantConfig(
              calibration_data_reader=CalibReader("calibration_data"),
              calibrate_method=CalibrationMethod.Percentile,
              op_types_to_quantize=["MatMul", "Gather"],
              per_channel=True,
              calibration_sampling_size=128,
              extra_options={
                  "SmoothQuant": True,
                  "SmoothQuantAlpha": 0.5,
                  "SmoothQuantOpTypes": ["MatMul"],
                  "SmoothQuantFolding": True,
                  "calib_dump_batch": 8,
                  "TmpDir": "dreamlite_onnx",
                  "layer_wise_quant": True,
              },
          )

          
          # ── Patch ONNXModel.topological_sort for duplicate node names ──
          # The fork fixed calibration + augment, but folding creates duplicate
          # node names, and the stock topological_sort asserts on that.
          # This version renames every node uniquely first, then sorts.
          from onnx_neural_compressor.onnx_model import ONNXModel

          def _safe_topological_sort(self, enable_subgraph=False):
              # Step 1: give every node a unique name
              _seen = set()
              for _node in self.model.graph.node:
                  _name = _node.name
                  if not _name or _name in _seen:
                      _base = _name or _node.op_type
                      _i = 0
                      while f"{_base}_{_i}" in _seen:
                          _i += 1
                      _node.name = f"{_base}_{_i}"
                  _seen.add(_node.name)

              # Step 2: Kahn's algorithm on the renamed graph
              _output_to_node = {}
              for _node in self.model.graph.node:
                  for _out in _node.output:
                      if _out:
                          _output_to_node[_out] = _node

              _in_degree = {n.name: 0 for n in self.model.graph.node}
              _children  = {n.name: [] for n in self.model.graph.node}
              _by_name   = {n.name: n for n in self.model.graph.node}

              for _node in self.model.graph.node:
                  for _inp in _node.input:
                      if _inp in _output_to_node:
                          _parent = _output_to_node[_inp]
                          if _parent.name in _children:
                              _children[_parent.name].append(_node.name)
                              _in_degree[_node.name] += 1

              _queue = [n for n, d in _in_degree.items() if d == 0]
              _sorted = []
              while _queue:
                  _name = _queue.pop(0)
                  _sorted.append(_name)
                  for _child in _children[_name]:
                      _in_degree[_child] -= 1
                      if _in_degree[_child] == 0:
                          _queue.append(_child)

              # Append any nodes that were not reached (cycles / disconnected parts)
              _remaining = [n.name for n in self.model.graph.node
                            if n.name not in _sorted]
              _sorted.extend(_remaining)

              _sorted_nodes = [_by_name[n] for n in _sorted]
              del self.model.graph.node[:]
              self.model.graph.node.extend(_sorted_nodes)

          ONNXModel.topological_sort = _safe_topological_sort
          print("  patched ONNXModel.topological_sort: unique names + cycle-safe sort")
          
          # ── Release SmoothQuant phase memory before static calibration ──
          import gc
          gc.collect()
          gc.collect()  # second pass for reference cycles
          print("  released Python objects before static calibration")

          # ── Fix missing external .data in smoother temp dir ──
          import shutil
          from onnx_neural_compressor.algorithms.smoother import core as smoother_core

          _orig_smoother_init = smoother_core.Smoother.__init__

          def _patched_smoother_init(self, model, *args, **kwargs):
              # Figure out the directory the smoother will load the model from
              model_path = None
              if isinstance(model, str):
                  model_path = model
              elif hasattr(model, "_model_path"):
                  model_path = model._model_path

              if model_path:
                  model_dir = os.path.dirname(os.path.abspath(model_path))
                  src_data = os.path.abspath("dreamlite_onnx/text_encoder_fp16.onnx.data")
                  dst_data = os.path.join(model_dir, "text_encoder_fp16.onnx.data")
                  if os.path.exists(src_data) and not os.path.exists(dst_data):
                      shutil.copy2(src_data, dst_data)
                      print(f"  copied external .data to {dst_data}")

              return _orig_smoother_init(self, model, *args, **kwargs)

          smoother_core.Smoother.__init__ = _patched_smoother_init
          print("  patched Smoother.__init__ to copy external .data into temp dir")
          
          quantize(src, dst, qconfig)
          gc.collect()

          
          # ── Neural-compressor writes external data as <name>.onnx_data
          #    (underscore), but ONNX Runtime / Kotlin expects
          #    <name>.onnx.data (dot). Re-save so the companion file uses
          #    the correct extension.
          import onnx
          legacy_data = dst + "_data"
          if os.path.exists(legacy_data):
              print(f"  re-saving external data: {legacy_data} → {dst}.data")
              m = onnx.load(dst, load_external_data=False)
              onnx.external_data_helper.load_external_data_for_model(
                  m, os.path.dirname(os.path.abspath(dst)))
              onnx.save_model(
                  m, dst,
                  save_as_external_data=True,
                  all_tensors_to_one_file=True,
                  location=os.path.basename(dst) + ".data",
                  size_threshold=1024,
                  convert_attribute=False,
              )
              os.remove(legacy_data)
              print(f"✓ re-saved with {dst}.data")
          else:
              print(f"  no legacy _data file found; checking {dst}.data")
              
          print(f"✓ {dst}: {os.path.getsize(dst)//1024//1024} MB")
          if os.path.exists(dst + ".data"):
              print(f"✓ {dst}.data: {os.path.getsize(dst + '.data')//1024//1024} MB")

          # Update manifest
          with open("dreamlite_onnx/manifest.json") as f:
              m = json.load(f)
          files = [f for f in os.listdir("dreamlite_onnx") if f.endswith(".onnx")]
          m["components"] = files
          m["has_encoder"] = "text_encoder.onnx" in files
          with open("dreamlite_onnx/manifest.json", "w") as f:
              json.dump(m, f, indent=2)
          PYEOF

      
      # FIX: Copy ONNX files DIRECTLY into assets — no zip container.
      # Previously the workflow ran "zip -r assets/dreamlite.zip ." which caused
      # double-compression: aapt re-compressed the zip inside the APK even with
      # noCompress set, because noCompress only covers the outer file extension.
      # Storing files flat in assets/ with noCompress += "onnx" means aapt stores
      # each .onnx uncompressed, and ImageGenerator.kt copies them to filesDir
      # on first launch for ONNX Runtime to read as normal files.
      - name: Copy ONNX files directly into assets (no zip container)
        run: |
          mkdir -p lfm25/app/src/main/assets
          exported=0
           for f in dreamlite_onnx/vae_decoder.onnx dreamlite_onnx/vae_decoder.onnx.data \
           dreamlite_onnx/vae_encoder.onnx dreamlite_onnx/vae_encoder.onnx.data \
           dreamlite_onnx/text_encoder.onnx dreamlite_onnx/text_encoder.onnx.data \
           dreamlite_onnx/text_encoder_edit.onnx dreamlite_onnx/text_encoder_edit.onnx.data \
           dreamlite_onnx/unet.onnx dreamlite_onnx/tokenizer.json \
           dreamlite_onnx/manifest.json; do
            if [ -f "$f" ]; then
              cp "$f" lfm25/app/src/main/assets/
              echo "✓ Copied $(basename $f): $(du -sh $f | cut -f1)"
              exported=$((exported+1))
            else
              echo "⚠ $(basename $f) not available"
            fi
          done
          echo "Total ONNX components copied: $exported"
          echo "Assets:"
          ls -lh lfm25/app/src/main/assets/

      - name: Install NDK and CMake
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name "sdkmanager" | head -1)
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x lfm25/gradlew

      # FIX: every GitHub Actions run starts on a brand new, empty VM, so
      # `[ ! -f "$KEYSTORE_PATH" ]` was true on EVERY build — this step actually
      # generated a brand new signing key (new RSA pair, new app signature) each
      # time, despite being named "consistent". That's why installing an "update"
      # over an existing install failed with "App not installed": every APK had a
      # different signature. By request, the fix here is a signing key committed
      # straight into the repo at lfm25/thunder_agi.jks (allow-listed in
      # .gitignore) — no GitHub secrets, no extra CI step, nothing to set up.
      # app/build.gradle.kts already points at that file and signs with it
      # automatically whenever it's present, so checkout alone is enough; this
      # step is gone. The one real tradeoff: anyone who can see this repo can see
      # that key, so anyone could sign their own APK that Android would accept as
      # an "update" to yours. Switch to a GitHub-secrets-based key instead if that
      # ever stops being an acceptable tradeoff.

      - name: Build Release APK
        working-directory: lfm25
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Copy APK to output
        run: |
          mkdir -p output
          APK="lfm25/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="lfm25/app/build/outputs/apk/debug/app-debug.apk"
            echo "Using debug APK"
          fi
          cp "$APK" "output/ThunderAGI-الرعد-v3.apk"
          echo "APK size: $(du -sh output/ThunderAGI-الرعد-v3.apk)"

      - name: Verify APK
        run: |
          python3 -c "
          import zipfile, sys
          with zipfile.ZipFile('output/ThunderAGI-الرعد-v3.apk') as z:
              files = z.namelist()
              onnx = [f for f in files if f.endswith('.onnx')]
              print(f'APK OK: {len(files)} files, ONNX={onnx}')
              if not any(f.endswith('.dex') for f in files):
                  sys.exit(1)
          "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAGI-الرعد-v3
          path: output/ThunderAGI-الرعد-v3.apk
          retention-days: 30

      - name: Show install instructions
        run: |
          echo "=== HOW TO INSTALL ==="
          echo "1. Download the artifact ZIP from GitHub Actions"
          echo "2. EXTRACT the ZIP — you will find ThunderAGI-الرعد-v3.apk inside"
          echo "3. Copy the .apk to your phone and tap to install"
          echo "APK size: $(du -sh output/ThunderAGI-الرعد-v3.apk)"
