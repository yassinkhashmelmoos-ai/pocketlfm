          def finalize_single_file(model, path):
              """IR cap for ORT 1.17, contrib opset import, single self-contained file below the protobuf limit."""
              if default_opset(model) > 20:
                  raise RuntimeError(f"opset {default_opset(model)} is newer than ORT 1.17 supports (<=20)")
              model.ir_version = min(model.ir_version, 9)
              size = model.ByteSize()
              if size > MAX_PROTO:
                  raise RuntimeError(f"model is {size/1e9:.2f} GB; single-file ONNX is limited to 2 GB (app copies no .data files)")
              tmp = path + ".tmp"
              onnx.save_model(model, tmp, save_as_external_data=False)
              os.replace(tmp, path)
              return os.path.getsize(path)


          def model_nbytes(path):
              s = os.path.getsize(path)
              d = path + ".data"
              return s + (os.path.getsize(d) if os.path.exists(d) else 0)


          # ───────────────────────────── role classification ──────────────────────────
          def _attr_i(n, name):
              return next((a.i for a in n.attribute if a.name == name), 0)


          def const_matmuls(model, src):
              """MatMul / Gemm nodes whose weight (input[1]) is a constant float 2-D initializer.  ViT linears are usually exported as Gemm(transB=1)."""
              out = []
              for n in model.graph.node:
                  if n.op_type in ("MatMul", "Gemm") and len(n.input) >= 2 and src.has(n.input[1]) and len(src.shape(n.input[1])) == 2 and src.dtype(n.input[1]) in (F32, F16):
                      if n.op_type == "Gemm" and _attr_i(n, "transA"):
                          continue
                      out.append(n)
              return out


          def eff_shape(src, n):
              """(K, N) of the linear map regardless of how the weight is stored."""
              s = src.shape(n.input[1])
              return (s[1], s[0]) if (n.op_type == "Gemm" and _attr_i(n, "transB")) else s


          def w_axis(n):
              """Output-channel axis of the weight tensor as stored (for per-channel INT8)."""
              if n.op_type == "Gemm":
                  return 0 if _attr_i(n, "transB") else 1
              return 1 if n.op_type == "MatMul" else 0


          def classify_lm(model, src, ta, va=None):
              """Name-free role detection for the Qwen3-VL LM + vision tower, using the model dims written to the manifest.
              (dynamo exports give anonymous node names, so shapes + graph order are the only reliable signals.)"""
              D, I = ta["hidden"], ta["intermediate"]
              QO, KV = ta["heads"] * ta["head_dim"], ta["kv_heads"] * ta["head_dim"]
              vs = set()
              if va:
                  Vh, Vi, Vo, mg = va["hidden"], va["intermediate"], va["out_hidden"], va.get("merge", 2)
                  M = Vh * mg * mg
                  vs = {(Vh, 3 * Vh), (Vh, Vh), (Vh, Vi), (Vi, Vh), (M, M), (M, Vo)}
              lm_shapes = {(I, D), (D, I), (D, KV), (D, QO)}
              info, order = {}, []
              for n in const_matmuls(model, src):
                  K, N = eff_shape(src, n)
                  if (K, N) in vs and (K, N) not in lm_shapes:
                      role = "vision"
                  elif (K, N) == (I, D): role = "down"
                  elif (K, N) == (D, I): role = "gateup"
                  elif (K, N) == (D, KV): role = "kv"
                  elif (K, N) == (D, QO): role = "qo"
                  else: role = "other"
                  info[n.name] = dict(node=n, K=K, N=N, role=role, layer=None)
                  order.append(n.name)
              by_in = {}
              for nm in order:
                  by_in.setdefault(info[nm]["node"].input[0], []).append(nm)
              for inp, grp in by_in.items():                    # q/k/v and gate/up share one input tensor; call order is q,k,v / gate,up
                  kv = [g for g in grp if info[g]["role"] == "kv"]
                  qo = [g for g in grp if info[g]["role"] == "qo"]
                  gu = [g for g in grp if info[g]["role"] == "gateup"]
                  if len(kv) == 2 and len(qo) >= 1:
                      info[kv[0]]["role"], info[kv[1]]["role"] = "k", "v"
                      for q in qo: info[q]["role"] = "q"
                  if len(gu) == 2:
                      info[gu[0]]["role"], info[gu[1]]["role"] = "gate", "up"
              for nm in order:
                  if info[nm]["role"] == "qo": info[nm]["role"] = "o"       # a qo-shaped matmul outside any q/k/v group is the output projection
              cnt = {}
              for nm in order:                                  # layer index = n-th occurrence of the role in graph order
                  r = info[nm]["role"]
                  info[nm]["layer"] = cnt.get(r, 0); cnt[r] = cnt.get(r, 0) + 1
              n_layers = max(cnt.get("v", 0), cnt.get("down", 0)) or ta.get("layers", 0)
              return info, n_layers


          def use_more_bits(i, n):
              """llama.cpp's Q4_K_M rule: which layers get the higher-precision type for attn_v / ffn_down."""
              return i < n // 8 or i >= 7 * n // 8 or (i - n // 8) % 3 == 2


          def lm_policy(role, layer, n_layers, recipe):
              if recipe == "int8" or role == "other":           # unknown shapes are never gambled on: INT8
                  return "int8"
              if recipe == "arm":                               # Arm/llama.cpp Q4_K_M analogue
                  lay = (layer // 2) if (role == "kv" and layer is not None) else layer          # unresolved k/v pair: two nodes per layer
                  return "int8" if (role in ("v", "down", "kv") and lay is not None and use_more_bits(lay, n_layers)) else "int4"
              if recipe == "protect":                           # every v/k/o/down kept at 8-bit (also when q/k/v grouping could not be resolved)
                  return "int8" if role in ("v", "k", "o", "down", "kv", "qo", "other") else "int4"
              raise ValueError(recipe)


          def unet_role(node):
              nm = node.name.lower()
              if node.op_type == "Conv":
                  return "stem" if "conv_in" in nm else "head" if "conv_out" in nm else "conv"
              if any(k in nm for k in ("to_q", "to_k", "to_v")): return "qkv"
              if "to_out" in nm: return "attn_out"
              if "/ff/" in nm or "net.0" in nm or "net.2" in nm or "geglu" in nm: return "ffn"
              if "proj_in" in nm or "proj_out" in nm: return "proj"
              return "linear"


          # ───────────────────────────── recipes → rewritten models ───────────────────
          def apply_lm_recipe(rw, ta, va, recipe, min_sqnr=17.5, algo="hqq", bs=None):
              """Q4_K_M-style mixed precision on an exported Qwen3-VL graph, in formats ORT 1.17 can execute.
              bs = dict(cov=..., max_err=..., rho_max=...) additionally factorizes shareable pairs BEFORE quantization (Basis Sharing)."""
              info, n_layers = classify_lm(rw.m, rw.src, ta, va)
              cnt = {}
              if bs:
                  a, sk, saved = apply_basis_sharing(rw, info, n_layers, bs["cov"], bs["max_err"], bs["rho_max"], algo)
                  cnt["basis-sharing groups"] = a; cnt["basis-sharing skipped"] = sk; cnt["basis-sharing params saved(M)"] = round(saved / 1e6, 1)
              for nm, d in info.items():
                  n, role = d["node"], d["role"]
                  if d.get("done"):
                      continue
                  if role == "vision":
                      rw.int8_dq(n, 1, axis=w_axis(n)); fmt = "vision-int8"
                  else:
                      want = lm_policy(role, d["layer"], n_layers, recipe)
                      fmt = want if n.op_type == "MatMul" else "int8"
                      if want == "int4" and n.op_type == "MatMul":
                          ok, sq = rw.nbits4(n, algo, 32, min_sqnr=min_sqnr)        # Chameleon-style: format chosen by reconstruction error
                          if not ok:
                              rw.int8_dq(n, 1, axis=1); fmt = "int8(sqnr-upgrade)"
                      else:
                          rw.int8_dq(n, 1, axis=w_axis(n))
                  cnt[fmt] = cnt.get(fmt, 0) + 1
              for n in list(rw.m.graph.node):                   # patch-embed Conv3d etc. in the vision tower -> INT8
                  if n.op_type == "Conv" and len(n.input) > 1 and rw.src.has(n.input[1]) and rw.src.array(n.input[1]).size > 100_000:
                      rw.int8_dq(n, 1, axis=0); cnt["conv-int8"] = cnt.get("conv-int8", 0) + 1
              vocab = ta.get("vocab", 50_000)
              for n in list(rw.m.graph.node):
                  if n.op_type == "Gather" and rw.src.has(n.input[0]) and len(rw.src.shape(n.input[0])) == 2 and rw.src.shape(n.input[0])[0] >= min(vocab, 50_000):
                      rw.embedding_int8(n); cnt["embed-int8"] = cnt.get("embed-int8", 0) + 1
              k = rw.catch_all_int8()
              if k: cnt["catch-all-int8"] = k
              return cnt, n_layers, info


          def apply_unet_recipe(rw, recipe, min_sqnr=17.5):
              """Chameleon-style weight formats for a diffusion UNet: Conv -> INT8 per-channel, Linear -> INT4(g32) when its SQNR allows, else INT8.
              Paper keeps conv_in/conv_out and (in its evaluation) attention Q/K/V in FP16: reproduced by the 'paper' recipe."""
              cnt = {}
              for n in list(rw.m.graph.node):
                  if n.op_type == "Conv" and len(n.input) > 1 and rw.src.has(n.input[1]):
                      role = unet_role(n)
                      if role in ("stem", "head"):
                          rw.fp16_weight(n, 1); cnt["conv-fp16"] = cnt.get("conv-fp16", 0) + 1
                      elif rw.src.array(n.input[1]).size >= 2048:
                          rw.int8_dq(n, 1, axis=0); cnt["conv-int8"] = cnt.get("conv-int8", 0) + 1
                  elif n.op_type == "MatMul" and len(n.input) == 2 and rw.src.has(n.input[1]) and len(rw.src.shape(n.input[1])) == 2:
                      role = unet_role(n)
                      K, N = rw.src.shape(n.input[1])
                      if K * N < 4096:
                          continue
                      if recipe == "all8" or (recipe == "int8qkv" and role == "qkv"):
                          rw.int8_dq(n, 1, axis=1); cnt["lin-int8"] = cnt.get("lin-int8", 0) + 1
                      elif recipe == "paper" and role == "qkv":
                          rw.fp16_weight(n, 1); cnt["lin-fp16"] = cnt.get("lin-fp16", 0) + 1
                      else:
                          ok, sq = rw.nbits4(n, "hqq", 32, min_sqnr=min_sqnr)
                          if ok: cnt["lin-int4"] = cnt.get("lin-int4", 0) + 1
                          else:
                              rw.int8_dq(n, 1, axis=1); cnt["lin-int8(sqnr-upgrade)"] = cnt.get("lin-int8(sqnr-upgrade)", 0) + 1
              k = rw.catch_all_int8(100_000)                    # e.g. Gemm time-embedding MLPs
              if k: cnt["catch-all-int8"] = k
              return cnt


          def apply_vae_recipe(rw):
              """PassionSR-flavoured VAE: weights only (INT8 per-channel + MSE-optimal boundary), first/last convs kept FP32."""
              cnt = {}
              convs = [n for n in rw.m.graph.node if n.op_type == "Conv" and len(n.input) > 1 and rw.src.has(n.input[1])]
              first_last = {convs[0].name, convs[-1].name} if convs else set()
              for n in convs:
                  if n.name in first_last or "conv_in" in n.name.lower() or "conv_out" in n.name.lower():
                      continue
                  if rw.src.array(n.input[1]).size >= 2048:
                      rw.int8_dq(n, 1, axis=0); cnt["conv-int8"] = cnt.get("conv-int8", 0) + 1
              for n in [n for n in rw.m.graph.node if n.op_type == "MatMul" and len(n.input) == 2 and rw.src.has(n.input[1]) and len(rw.src.shape(n.input[1])) == 2]:
                  rw.int8_dq(n, 1, axis=1); cnt["lin-int8"] = cnt.get("lin-int8", 0) + 1
              k = rw.catch_all_int8(100_000)
              if k: cnt["catch-all-int8"] = k
              return cnt


          # ───────────────────────────── evaluation (on-device-equivalent runtime) ────
          RUNNER = r'''
