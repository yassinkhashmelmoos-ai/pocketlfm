                      else: x0 = rng.standard_normal((1, 4, Hs, Ws // 2 if Ws == 2 * Hs else Ws)).astype(np.float32) * 0.8; cond = np.zeros_like(x0)
                      for sg in (0.9, 0.6, 0.3, 0.1):
                          eps = rng.standard_normal(x0.shape).astype(np.float32)
                          xt = (1 - sg) * x0 + sg * eps
