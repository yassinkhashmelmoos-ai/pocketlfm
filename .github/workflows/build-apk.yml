name: Build Thunder AGI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove adaptive icon overrides (use density-specific webp icons instead)
        run: |
          rm -f lfm25/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          rm -f lfm25/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          echo "Adaptive icon XMLs removed"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Python deps
        run: |
          pip install Pillow
          pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.57.3" "diffusers==0.30.3" accelerate onnx onnxruntime
          pip install huggingface_hub

      - name: Generate all mipmap icon sizes from source icon
        run: |
          python3 << 'PYEOF'
          from PIL import Image
          import os
          src = "lfm25/app/src/main/assets/app_icon_source.jpg"
          if not os.path.exists(src):
              print("WARNING: app_icon_source.jpg not found, skipping icons")
          else:
              sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
              img = Image.open(src).convert("RGBA")
              for name, size in sizes.items():
                  d = f"lfm25/app/src/main/res/mipmap-{name}"
                  os.makedirs(d, exist_ok=True)
                  r = img.resize((size,size), Image.LANCZOS)
                  r.save(f"{d}/ic_launcher.webp","WEBP")
                  r.save(f"{d}/ic_launcher_round.webp","WEBP")
                  print(f"✓ {name} {size}x{size}")
          PYEOF

      - name: Download LFM2.5-VL model
        run: |
          mkdir -p lfm25/app/src/main/assets
          wget -q --show-progress \
            "https://huggingface.co/LiquidAI/LFM2.5-VL-450M-GGUF/resolve/main/LFM2.5-VL-450M-Q4_K_M.gguf" \
            -O lfm25/app/src/main/assets/model.gguf
          echo "LFM model: $(du -sh lfm25/app/src/main/assets/model.gguf)"

      - name: Download and convert DreamLite to ONNX for Android
        run: |
          python3 << 'PYEOF'
          import os, sys, torch, json
          print("=== DreamLite ONNX Export Pipeline ===")

          from huggingface_hub import snapshot_download
          from diffusers import AutoencoderKL, UNet2DConditionModel, AutoPipelineForText2Image
          from transformers import CLIPTextModel, CLIPTokenizer
          import numpy as np

          os.makedirs("dreamlite_onnx", exist_ok=True)

          # ── 1. VAE decoder ─────────────────────────────────────────────────
          print("Downloading HD VAE (madebyollin/sdxl-vae-fp16-fix)...")
          try:
              vae = AutoencoderKL.from_pretrained(
                  "madebyollin/sdxl-vae-fp16-fix", torch_dtype=torch.float32)
              vae.eval()
              torch.onnx.export(
                  vae.decoder, torch.randn(1, 4, 64, 64),
                  "dreamlite_onnx/vae_decoder.onnx",
                  input_names=["latent_sample"], output_names=["image"],
                  dynamic_axes={"latent_sample": {0: "batch"}}, opset_version=17)
              print(f"✓ VAE decoder: {os.path.getsize('dreamlite_onnx/vae_decoder.onnx')//1024//1024} MB")
              del vae
          except Exception as e:
              print(f"VAE export failed: {e}")

          # ── 2. CLIP text encoder ──────────────────────────────────────────
          print("Downloading CLIP text encoder...")
          try:
              tokenizer = CLIPTokenizer.from_pretrained("openai/clip-vit-large-patch14")
              text_encoder = CLIPTextModel.from_pretrained(
                  "openai/clip-vit-large-patch14", torch_dtype=torch.float32)
              text_encoder.eval()
              torch.onnx.export(
                  text_encoder, torch.zeros((1, 77), dtype=torch.long),
                  "dreamlite_onnx/text_encoder.onnx",
                  input_names=["input_ids"], output_names=["last_hidden_state"],
                  dynamic_axes={"input_ids": {0: "batch"}}, opset_version=17)
              tokenizer.save_pretrained("dreamlite_onnx/tokenizer")
              print(f"✓ Text encoder: {os.path.getsize('dreamlite_onnx/text_encoder.onnx')//1024//1024} MB")
              del text_encoder, tokenizer
          except Exception as e:
              print(f"Text encoder export failed: {e}")

          # ── 3. UNet — try DreamLite first, fall back to TinySD ────────────
          unet_exported = False
          num_steps = 20

          print("Trying DreamLite UNet...")
          try:
              dl_path = snapshot_download(
                  "carlofkl/DreamLite-base",
                  revision="diffusers",
                  local_dir="dreamlite_base")
              unet = UNet2DConditionModel.from_pretrained(
                  f"{dl_path}/unet", torch_dtype=torch.float32)
              unet.eval()
              torch.onnx.export(
                  unet,
                  (torch.randn(2, 4, 64, 64),
                   torch.tensor([999, 999]),
                   torch.randn(2, 77, 768)),
                  "dreamlite_onnx/unet.onnx",
                  input_names=["sample", "timestep", "encoder_hidden_states"],
                  output_names=["out_sample"], opset_version=17)
              unet_exported = True
              print(f"✓ DreamLite UNet: {os.path.getsize('dreamlite_onnx/unet.onnx')//1024//1024} MB")
              del unet
          except Exception as e:
              print(f"DreamLite UNet not available ({e}), using TinySD fallback...")

          if not unet_exported:
              print("Downloading TinySD UNet (segmind/tiny-sd)...")
              try:
                  pipe = AutoPipelineForText2Image.from_pretrained(
                      "segmind/tiny-sd", torch_dtype=torch.float32)
                  pipe.unet.eval()
                  torch.onnx.export(
                      pipe.unet,
                      (torch.randn(2, 4, 64, 64),
                       torch.tensor([999, 999]),
                       torch.randn(2, 77, 768)),
                      "dreamlite_onnx/unet.onnx",
                      input_names=["sample", "timestep", "encoder_hidden_states"],
                      output_names=["out_sample"], opset_version=17)
                  unet_exported = True
                  print(f"✓ TinySD UNet: {os.path.getsize('dreamlite_onnx/unet.onnx')//1024//1024} MB")
                  del pipe
              except Exception as e:
                  print(f"TinySD export also failed: {e}")
                  print("WARNING: No UNet — offline image generation disabled")

          # ── 4. Manifest ────────────────────────────────────────────────────
          manifest = {
              "version": "2.0",
              "components": ["text_encoder.onnx", "vae_decoder.onnx", "unet.onnx"],
              "has_unet": unet_exported,
              "params": {
                  "num_inference_steps": num_steps,
                  "guidance_scale": 7.0,
                  "negative_prompt": "blurry, distorted, ugly, bad anatomy, text, watermark",
                  "resolution": 512,
                  "latent_dim": 64
              }
          }
          with open("dreamlite_onnx/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print("✓ Manifest written")
          print("Available ONNX files:", os.listdir("dreamlite_onnx"))
          PYEOF

      # FIX: Copy ONNX files DIRECTLY into assets — no zip container.
      # Zipping caused double-compression: the zip was re-compressed by aapt
      # inside the APK, so Android had to decompress twice, corrupting streams.
      # With direct asset files + noCompress in build.gradle.kts the files are
      # stored uncompressed and ImageGenerator.kt copies them to filesDir as-is.
      - name: Copy DreamLite ONNX files directly into assets (no zip)
        run: |
          mkdir -p lfm25/app/src/main/assets
          if [ -d "dreamlite_onnx" ] && [ "$(ls dreamlite_onnx/*.onnx 2>/dev/null | wc -l)" -gt "0" ]; then
            # Copy each ONNX file directly — NOT zipped
            for f in dreamlite_onnx/*.onnx dreamlite_onnx/manifest.json; do
              [ -f "$f" ] && cp "$f" lfm25/app/src/main/assets/
            done
            echo "DreamLite ONNX files copied directly to assets:"
            ls -lh lfm25/app/src/main/assets/*.onnx lfm25/app/src/main/assets/manifest.json 2>/dev/null || true
          else
            echo "WARNING: No ONNX files in dreamlite_onnx/ — offline image generation will be skipped"
            ls -la dreamlite_onnx/ 2>/dev/null || echo "dreamlite_onnx/ missing"
            # Do NOT exit 1 — app still works without image generation (online fallback)
          fi
          echo "Full assets:"
          ls -lh lfm25/app/src/main/assets/

      - name: Install NDK and CMake
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name "sdkmanager" | head -1)
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x lfm25/gradlew

      - name: Generate consistent signing keystore
        run: |
          KEYSTORE_PATH="$HOME/thunder_agi.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -alias thunder_agi \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass ThunderAGI2026! \
              -keypass ThunderAGI2026! \
              -dname "CN=Thunder AGI, OU=Thunder, O=Yassin Khashelmoos, L=Khartoum, ST=Khartoum, C=SD"
            echo "Keystore generated"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV

      - name: Build Release APK
        working-directory: lfm25
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ env.KEYSTORE_PATH }} \
            -Pandroid.injected.signing.store.password=ThunderAGI2026! \
            -Pandroid.injected.signing.key.alias=thunder_agi \
            -Pandroid.injected.signing.key.password=ThunderAGI2026! \
            --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Copy APK to output
        run: |
          mkdir -p output
          APK="lfm25/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="lfm25/app/build/outputs/apk/debug/app-debug.apk"
            echo "Using debug APK"
          fi
          cp "$APK" "output/ThunderAGI-الرعد-v3.apk"
          echo "APK size: $(du -sh output/ThunderAGI-الرعد-v3.apk)"

      - name: Verify APK is valid
        run: |
          APK="output/ThunderAGI-الرعد-v3.apk"
          python3 -c "
          import zipfile, sys
          try:
              with zipfile.ZipFile('$APK') as z:
                  files = z.namelist()
                  has_manifest = 'AndroidManifest.xml' in files
                  has_dex = any(f.endswith('.dex') for f in files)
                  has_lib = any(f.startswith('lib/') for f in files)
                  onnx_files = [f for f in files if f.endswith('.onnx')]
                  print(f'APK valid: manifest={has_manifest} dex={has_dex} lib={has_lib}')
                  print(f'ONNX files in APK: {onnx_files}')
                  print(f'Total files: {len(files)}')
                  if not has_manifest or not has_dex:
                      print('ERROR: APK missing required components!')
                      sys.exit(1)
                  print('APK validation PASSED')
          except Exception as e:
              print(f'APK validation FAILED: {e}')
              sys.exit(1)
          "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAGI-الرعد-v3
          path: output/ThunderAGI-الرعد-v3.apk
          retention-days: 30

      - name: Show install instructions
        run: |
          echo ""
          echo "=== HOW TO INSTALL ==="
          echo "1. Download the artifact ZIP from GitHub"
          echo "2. EXTRACT the ZIP — you will find ThunderAGI-الرعد-v3.apk inside"
          echo "3. Copy ONLY the .apk file to your phone"
          echo "4. Tap the .apk file to install"
          echo "DO NOT try to install the .zip — extract it first!"
          echo "APK size: $(du -sh output/ThunderAGI-الرعد-v3.apk)"
