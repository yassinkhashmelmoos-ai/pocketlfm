                  device = dummy_vis_ids.device
                  i = torch.arange(num_image, device=device)
                  img_t = torch.ones(num_image, dtype=torch.long, device=device)   # 1, not 0
                  img_h = i // merged_w + 1                                       # +1 offset
                  img_w = i % merged_w + 1                                        # +1 offset
                  start = torch.zeros(1, dtype=torch.long, device=device)
                  tail = torch.arange(tail_len, device=device) + merged_h + 1
                  pos_t = torch.cat([start, img_t, tail], dim=0).unsqueeze(0).unsqueeze(0)
                  pos_h = torch.cat([start, img_h, tail], dim=0).unsqueeze(0).unsqueeze(0)
                  pos_w = torch.cat([start, img_w, tail], dim=0).unsqueeze(0).unsqueeze(0)
                  manual_pos_ids = torch.cat([pos_t, pos_h, pos_w], dim=0)

              pos_diff = (ref_pos_ids.float() - manual_pos_ids.float()).abs()
              print("=" * 60)
              print("DIAG A: position_ids comparison")
              print(f"  ref shape:    {tuple(ref_pos_ids.shape)}")
              print(f"  manual shape: {tuple(manual_pos_ids.shape)}")
              if ref_pos_ids.shape == manual_pos_ids.shape:
                  print(f"  max abs diff: {pos_diff.max().item():.4f}")
                  print(f"  mean abs diff: {pos_diff.mean().item():.4f}")
                  # Find first mismatch
                  nonzero = pos_diff.nonzero()
                  if len(nonzero) > 0:
                      first = nonzero[0].tolist()
                      print(f"  first mismatch at [T/H/W={first[0]}, batch={first[1]}, seq={first[2]}]")
                      idx = first[2]
                      print(f"    ref[{first[0]},{first[1]},{idx}]  = {ref_pos_ids[first[0],first[1],idx].item()}")
                      print(f"    manual[{first[0]},{first[1]},{idx}] = {manual_pos_ids[first[0],first[1],idx].item()}")
                      print(f"    dummy_vis_ids at {idx}: {dummy_vis_ids[0, idx].item()}")
              else:
                  print(f"  ✗ shape mismatch: {ref_pos_ids.shape} vs {manual_pos_ids.shape}")

              # (b) Does the patched model match the unpatched model?
              # Restore original methods temporarily for reference
              with torch.no_grad():
                  patched_out = qwen_vision(
                      input_ids=dummy_vis_ids, attention_mask=dummy_vis_mask,
                      pixel_values=dummy_pixel_values, image_grid_thw=FIXED_GRID,
                      position_ids=manual_pos_ids,
                      output_hidden_states=True, use_cache=False,
                  ).hidden_states[-1].float()

              print("=" * 60)
              print("DIAG B: reference output stats (patched model)")
              print(f"  patched_out mean: {patched_out.mean().item():.4f}")
              print(f"  patched_out std:  {patched_out.std().item():.4f}")
              print(f"  patched_out min:  {patched_out.min().item():.4f}")
              print(f"  patched_out max:  {patched_out.max().item():.4f}")

              # ONNX output
              import onnxruntime as ort, numpy as np
              sess = ort.InferenceSession(
                  "dreamlite_onnx/text_encoder_edit_fp16.onnx",
                  providers=["CPUExecutionProvider"])
              ort_out = sess.run(None, {
                  "input_ids": dummy_vis_ids.numpy(),
                  "attention_mask": dummy_vis_mask.numpy(),
                  "pixel_values": dummy_pixel_values.numpy(),
              })[0]

              print("=" * 60)
              print("DIAG C: ONNX output stats")
              print(f"  ort_out mean: {ort_out.mean().item():.4f}")
              print(f"  ort_out std:  {ort_out.std().item():.4f}")
              print(f"  ort_out min:  {ort_out.min().item():.4f}")
              print(f"  ort_out max:  {ort_out.max().item():.4f}")
              print(f"  max abs diff (patched PyTorch vs ONNX): {np.abs(patched_out.numpy() - ort_out).max():.4f}")
              print("=" * 60)
          except Exception as ve:
              import traceback
              traceback.print_exc()
              print(f"  DIAGNOSTIC ERROR: {ve}")
              
          del qwen_vision
          gc.collect()
          print(f"✓ text_encoder_edit_fp16.onnx: {os.path.getsize('dreamlite_onnx/text_encoder_edit_fp16.onnx')//1024//1024} MB")

          merge_manifest({
              "vision_patch_size": 16,
              "vision_temporal_patch_size": 2,
              "vision_merge_size": 2,
              "vision_image_mean": [0.48145466, 0.4578275, 0.40821073],
              "vision_image_std":  [0.26862954, 0.26130258, 0.27577711],
              "vision_grid_h": 36,
              "vision_grid_w": 36,
          })
          
          PYEOF
          

      - name: Free disk before swap expansion
        run: |
          pip cache purge || true
          sudo rm -rf /tmp/* 2>/dev/null || true
          sudo apt-get clean || true
          echo "=== Disk after cleanup ==="
          df -h /
  

      - name: Prepare writable Android SDK directory
        run: |
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R $USER:$USER /usr/local/lib/android
          

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
        

      - name: Expand swap to 24GB before SmoothQuant
        run: |
          sudo swapoff /mnt/swapfile || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 48G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=49152
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "=== Memory after expansion ==="
          free -h
          echo "=== Disk ==="
          df -h /
          

      - name: Free disk again before SmoothQuant
        run: |
          pip cache purge || true
          sudo rm -rf /tmp/* 2>/dev/null || true
          sudo rm -rf /home/runner/work/_temp/* 2>/dev/null || true
          sudo apt-get clean || true
          echo "=== Disk after second cleanup ==="
          df -h /
          echo "=== Memory (should still be 24 GB swap) ==="
          free -h

      - name: Tune kernel to prevent premature OOM kill
        run: |
          # Lower swappiness to reduce thrashing
          sudo sysctl vm.swappiness=10
          
          # (Optional) Be strict about memory overcommitment
          # sudo sysctl vm.overcommit_memory=2
          
          # Protect the current shell's process tree (the Python script)
          # -1000 is the lowest possible OOM score, making it nearly unkillable.
          echo -1000 | sudo tee /proc/self/oom_score_adj
          
          echo "Kernel tuning applied."
          cat /proc/sys/vm/swappiness
          cat /proc/self/oom_score_adj
          

      - name: "Quantization 1/6 — real evaluation data + FP32 references (flickr30k, 128 calibration prompts for Basis Sharing)"
        timeout-minutes: 90
        env:
          TMPDIR: /home/runner/work/_temp
        run: |
          python3 quant/quant_pipeline.py prep

      - name: "Quantization 2/6 — VAE (PassionSR-style weights, gated on PSNR)"
        continue-on-error: true
        timeout-minutes: 30
        env:
          TMPDIR: /home/runner/work/_temp
        run: |
          python3 quant/quant_pipeline.py vae

      - name: "Quantization 3/6 — UNet (Chameleon-style weight formats, gated on denoiser cosine)"
        continue-on-error: true
        timeout-minutes: 90
        env:
          TMPDIR: /home/runner/work/_temp
        run: |
          python3 quant/quant_pipeline.py unet

      - name: "Quantization 4/6 — generate-mode text encoder (Q4_K_M-class mix + Basis Sharing probe, gated)"
        timeout-minutes: 100
        env:
          TMPDIR: /home/runner/work/_temp
        run: |
          python3 quant/quant_pipeline.py gen

      - name: "Quantization 5/6 — edit-mode text encoder (vision tower INT8, non-fatal)"
        continue-on-error: true
        timeout-minutes: 100
        env:
          TMPDIR: /home/runner/work/_temp
        run: |
          python3 quant/quant_pipeline.py edit

      - name: "Decide LM-weight sharing (needs the app's asset copy-list to be patchable)"
        run: |
          F=lfm25/app/src/main/java/com/thunder/agi/imaging/ImageGenerator.kt
          if [ "$SHARE_LM" = "1" ]; then
            if grep -qF '"text_encoder_edit.onnx", "unet.onnx", "tokenizer.json")' "$F"; then
              echo "copy-list found -> LM weights will be shared between both encoders"
            else
              echo "::warning::app copy-list not found in $F -> NOT sharing (models stay self-contained single files)"
              echo "SHARE_LM=0" >> "$GITHUB_ENV"
            fi
          else
            echo "LM-weight sharing disabled (workflow input share_lm_weights=false): each encoder is a self-contained file"
          fi

      - name: "Quantization 6/6 — pack, verify on the device-equivalent runtime, report sizes"
        timeout-minutes: 40
        env:
          TMPDIR: /home/runner/work/_temp
        run: |
          python3 quant/quant_pipeline.py pack

      - name: "Remove FP32 sources and work files (free disk for the APK build)"
        run: |
          rm -rf dreamlite_onnx/work dreamlite_onnx/eval
          rm -f dreamlite_onnx/text_encoder_fp16.onnx dreamlite_onnx/text_encoder_fp16.onnx.data dreamlite_onnx/text_encoder_edit_fp16.onnx dreamlite_onnx/text_encoder_edit_fp16.onnx.data
          rm -f dreamlite_onnx/unet.onnx dreamlite_onnx/unet_fp16.onnx dreamlite_onnx/vae_decoder.onnx dreamlite_onnx/vae_decoder.onnx.data dreamlite_onnx/vae_encoder.onnx dreamlite_onnx/vae_encoder.onnx.data
          echo "=== shipped models (dreamlite_onnx/out) ==="; ls -lh dreamlite_onnx/out; df -h / | tail -1

      - name: "Patch the app's asset copy-list for the shared LM-weights file (CI-only, not committed)"
        if: env.SHARE_LM == '1'
        run: |
          if [ -f dreamlite_onnx/out/lm_shared.bin ]; then
            F=lfm25/app/src/main/java/com/thunder/agi/imaging/ImageGenerator.kt
            sed -i 's/"text_encoder_edit.onnx", "unet.onnx", "tokenizer.json")/"text_encoder_edit.onnx", "unet.onnx", "tokenizer.json", "lm_shared.bin")/' "$F"
            grep -n 'lm_shared.bin' "$F" || { echo "::error::copy-list patch did not apply"; exit 1; }
          else
            echo "no lm_shared.bin produced -> app source untouched"
          fi

      - name: "Copy ONNX files directly into assets (single-file models, no zip container)"
        run: |
          mkdir -p lfm25/app/src/main/assets
          if ls dreamlite_onnx/out/*.onnx.data >/dev/null 2>&1; then echo "::error::an .onnx.data sidecar is present; the app never copies those"; exit 1; fi
          exported=0
          for f in dreamlite_onnx/out/*; do
            [ -f "$f" ] || continue
            cp "$f" lfm25/app/src/main/assets/
            echo "✓ Copied $(basename $f): $(du -sh $f | cut -f1)"
            exported=$((exported+1))
          done
          echo "Total components copied: $exported"
          echo "Assets:"; ls -lh lfm25/app/src/main/assets/
          TOTAL=$(du -sb lfm25/app/src/main/assets | cut -f1); echo "assets total bytes: $TOTAL"
          if [ "$TOTAL" -gt 3900000000 ]; then echo "::error::assets exceed ~3.9 GB; an APK cannot exceed 4 GiB"; exit 1; fi

      - name: Install NDK and CMake
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name "sdkmanager" | head -1)
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x lfm25/gradlew

      # FIX: every GitHub Actions run starts on a brand new, empty VM, so
      # `[ ! -f "$KEYSTORE_PATH" ]` was true on EVERY build — this step actually
      # generated a brand new signing key (new RSA pair, new app signature) each
      # time, despite being named "consistent". That's why installing an "update"
      # over an existing install failed with "App not installed": every APK had a
      # different signature. By request, the fix here is a signing key committed
      # straight into the repo at lfm25/thunder_agi.jks (allow-listed in
      # .gitignore) — no GitHub secrets, no extra CI step, nothing to set up.
      # app/build.gradle.kts already points at that file and signs with it
      # automatically whenever it's present, so checkout alone is enough; this
      # step is gone. The one real tradeoff: anyone who can see this repo can see
      # that key, so anyone could sign their own APK that Android would accept as
      # an "update" to yours. Switch to a GitHub-secrets-based key instead if that
      # ever stops being an acceptable tradeoff.

      - name: Build Release APK
        working-directory: lfm25
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Copy APK to output
        run: |
          mkdir -p output
          APK="lfm25/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            APK="lfm25/app/build/outputs/apk/debug/app-debug.apk"
            echo "Using debug APK"
          fi
          cp "$APK" "output/ThunderAGI-الرعد-v6-quantized.apk"
          echo "APK size: $(du -sh output/ThunderAGI-الرعد-v6-quantized.apk)"

      - name: "Check APK size limits"
        run: |
          SZ=$(stat -c%s "output/ThunderAGI-الرعد-v6-quantized.apk"); echo "APK bytes: $SZ ($((SZ/1024/1024)) MB)"
          if [ "$SZ" -gt 4294967295 ]; then echo "::error::APK exceeds the 4 GiB zip limit"; exit 1; fi
          if [ "$SZ" -gt 3900000000 ]; then echo "::warning::APK is within ~5% of the 4 GiB limit"; fi

      - name: Verify APK
        run: |
          python3 -c "
          import zipfile, sys
          with zipfile.ZipFile('output/ThunderAGI-الرعد-v6-quantized.apk') as z:
              files = z.namelist()
              onnx = [f for f in files if f.endswith('.onnx')]
              print(f'APK OK: {len(files)} files, ONNX={onnx}')
              if not any(f.endswith('.dex') for f in files):
                  sys.exit(1)
          "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThunderAGI-الرعد-v6-quantized
          path: output/ThunderAGI-الرعد-v6-quantized.apk
          retention-days: 30

      - name: Show install instructions
        run: |
          echo "=== HOW TO INSTALL ==="
          echo "1. Download the artifact ZIP from GitHub Actions"
          echo "2. EXTRACT the ZIP — you will find ThunderAGI-الرعد-v6-quantized.apk inside"
          echo "3. Copy the .apk to your phone and tap to install"
          echo "APK size: $(du -sh output/ThunderAGI-الرعد-v6-quantized.apk)"
