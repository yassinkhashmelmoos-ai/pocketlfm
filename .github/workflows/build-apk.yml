          # ───────────────────────────── Basis Sharing (Wang et al., ICLR 2025) ───────
          # Faithful to the paper's recipe: SVD-LLM style activation whitening, a basis shared across consecutive layers for
          # Wq/Wk/Wv/Wup/Wgate only (Wo and Wdown are NOT shared), per-layer coefficients.  ONNX layout y = x @ W, W:[K,N]:
          #   W_l ~= A_l @ B   with A_l:[K,r] per layer and B:[r,N] shared.  Error is measured in ACTIVATION space (||X (W - A B)||).
          BS_TYPES = ("q", "k", "v", "gate", "up")


          def bs_chol(G, eps=1e-3):
              G = np.asarray(G, np.float64); K = G.shape[0]
              return np.linalg.cholesky(G + eps * (np.trace(G) / K) * np.eye(K))


          def bs_group_plan(Ws, Ls, max_err, rho_max=0.9, step=32):
              """Whitened stacked SVD.  Returns dict(ok, rank, ratio, err, ...) and (if ok) the factors needed to apply it."""
              n, (K, N) = len(Ws), Ws[0].shape
              M = np.concatenate([L.T @ W.astype(np.float64) for L, W in zip(Ls, Ws)], axis=0).astype(np.float32)      # [(n K), N]
              U, S, Vt = np.linalg.svd(M, full_matrices=False)
              S2 = S.astype(np.float64) ** 2
              tail = np.append(np.cumsum(S2[::-1])[::-1], 0.0)                                                          # tail[j] = sum_{i>=j} S_i^2
              ranks = np.arange(step, len(S) + 1, step)
              errs = np.sqrt(tail[ranks] / tail[0])                                                                    # error if `rank` components kept
              ratios = (n * K * ranks + ranks * N) / float(n * K * N)
              good = np.where((errs <= max_err) & (ratios <= rho_max))[0]
              best = int(np.argmin(errs + 10 * np.maximum(ratios - rho_max, 0)))
              if len(good) == 0:
                  return dict(ok=False, err_at_rho=float(errs[np.searchsorted(ratios, rho_max)] if np.any(ratios >= rho_max) else errs[-1]), best_err=float(errs[best]), best_ratio=float(ratios[best]))
              j = int(good[np.argmin(ratios[good])]); r = int(ranks[j])
              B = (S[:r, None] * Vt[:r]).astype(np.float32)
              A = [np.linalg.solve(L.T, U[i * K:(i + 1) * K, :r].astype(np.float64)).astype(np.float32) for i, L in enumerate(Ls)]
              return dict(ok=True, rank=r, ratio=float(ratios[j]), err=float(errs[j]), A=A, B=B)


          def bs_groups(info, n_layers):
              """Pairs of consecutive layers per shareable type -> list of (type, [info entries])."""
              by = {}
              for nm, d in info.items():
                  if d["role"] in BS_TYPES and d.get("layer") is not None:
                      by.setdefault((d["role"], d["layer"]), d)
              out = []
              for t in BS_TYPES:
                  for l in range(0, n_layers - 1, 2):
                      if (t, l) in by and (t, l + 1) in by and by[(t, l)]["K"] == by[(t, l + 1)]["K"] and by[(t, l)]["N"] == by[(t, l + 1)]["N"]:
                          out.append((t, [by[(t, l)], by[(t, l + 1)]]))
              return out


          def bs_cov_for(d, cov, role_layer_input):
              key = ("attn" if d["role"] in ("q", "k", "v") else "mlp", d["layer"])
              return cov.get(key)


          def bs_probe(rw, info, n_layers, cov, max_err, rho_max, n_probe=3):
              """Cheap feasibility test on a few mid-network groups: is a >=(1-rho_max) saving available within the error budget?"""
              groups = [g for g in bs_groups(info, n_layers)]
              mid = [g for g in groups if g[1][0]["layer"] in (n_layers // 2 - (n_layers // 2) % 2,)] or groups[:n_probe]
              picks = ([g for g in mid if g[0] == "gate"][:1] + [g for g in mid if g[0] == "q"][:1] + [g for g in mid if g[0] == "k"][:1]) or mid[:n_probe]
              rep = []
              for t, ds in picks:
                  Gs = [bs_cov_for(d, cov, None) for d in ds]
                  if any(g is None for g in Gs):
                      continue
                  Ws = [rw.src.array(d["node"].input[1]) for d in ds]
                  plan = bs_group_plan(Ws, [bs_chol(G) for G in Gs], max_err, rho_max)
                  rep.append(dict(type=t, layers=[d["layer"] for d in ds], ok=plan["ok"], ratio=plan.get("ratio", plan.get("best_ratio")), err=plan.get("err", plan.get("best_err"))))
              return (any(r["ok"] for r in rep)), rep


          def apply_basis_sharing(rw, info, n_layers, cov, max_err, rho_max, algo="hqq"):
              """Replace shareable pairs by (A_l, shared B) 4-bit factor pairs.  Returns (applied_groups, skipped_groups, saved_params)."""
              applied = skipped = saved = 0
              for t, ds in bs_groups(info, n_layers):
                  Gs = [bs_cov_for(d, cov, None) for d in ds]
                  if any(g is None for g in Gs):
                      skipped += 1; continue
                  Ws = [rw.src.array(d["node"].input[1]) for d in ds]
                  plan = bs_group_plan(Ws, [bs_chol(G) for G in Gs], max_err, rho_max)
                  if not plan["ok"]:
                      skipped += 1; continue
                  rw.bs_pair([d["node"] for d in ds], plan["A"], plan["B"], algo)
                  for d in ds: d["done"] = True
                  K, N = Ws[0].shape; applied += 1; saved += len(ds) * K * N - (len(ds) * K * plan["rank"] + plan["rank"] * N)
                  log(f"  basis-sharing {t} layers {[d['layer'] for d in ds]}: rank {plan['rank']} ratio {plan['ratio']:.3f} act-err {plan['err']:.3f}")
              return applied, skipped, saved


          def _rewriter_bs_pair(self, nodes, As, B, algo="hqq"):
              r, N = B.shape
              pB, sB, zB, _, sqB = quant_nbits(B, 32, algo)
              base = f"{nodes[0].name}::bsB"
              self._add(base + "::Q4", pB); self._add(base + "::scales", sB); self._add(base + "::zp", zB)
              self._count("int4_bs", B.size, pB.nbytes + sB.nbytes + zB.nbytes)
              for node, A in zip(nodes, As):
                  K = A.shape[0]
                  pA, sA, zA, _, sqA = quant_nbits(A, 32, algo)
                  b = f"{node.name}::bsA"
                  self._add(b + "::Q4", pA); self._add(b + "::scales", sA); self._add(b + "::zp", zA)
                  mid = f"{node.output[0]}::bs_mid"
                  n1 = helper.make_node("MatMulNBits", [node.input[0], b + "::Q4", b + "::scales", b + "::zp"], [mid], name=node.name + "::BS_A", domain=MS, K=int(K), N=int(r), bits=4, block_size=32)
                  n2 = helper.make_node("MatMulNBits", [mid, base + "::Q4", base + "::scales", base + "::zp"], [node.output[0]], name=node.name + "::BS_B", domain=MS, K=int(r), N=int(N), bits=4, block_size=32)
                  self.replace[node.name] = [n1, n2]
                  self._release(node.input[1])
                  self._count("int4_bs", A.size, pA.nbytes + sA.nbytes + zA.nbytes)
                  self.log.append((node.name, node.input[1], "int4_bs", min(sqA, sqB)))


          Rewriter.bs_pair = _rewriter_bs_pair


          def residual_report(model, top=4):
              """What is still FP32/FP16 in the final graph (a big residual means some op pattern was not covered)."""
              items = []
              for t in model.graph.initializer:
                  if t.data_type in (F32, F16):
                      n = int(np.prod(t.dims)) if len(t.dims) else 1
                      items.append((n * (4 if t.data_type == F32 else 2), t.name))
              items.sort(reverse=True)
              return dict(residual_float_mb=round(sum(b for b, _ in items) / 1e6, 1), largest=[(nm[:70], round(b / 1e6, 1)) for b, nm in items[:top]])
