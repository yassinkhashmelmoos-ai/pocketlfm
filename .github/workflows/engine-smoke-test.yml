name: Engine smoke test

# Builds the app's own vendored llama.cpp + JNI layer on the runner (x86-64) and loads / generates with a tiny random-weight
# LFM2 model, through the app's real nativeLoadModel / nativeGenerate.
#
# Why: a hand-edited models/lfm2.cpp ("GeGLU instead of SiLU") made llama_init_from_model() hit GGML_ASSERT -> abort() on
# EVERY launch of the app. A native abort cannot be caught or logged by the app, and it was only discovered after the
# multi-hour APK build, on a phone. This catches that class of bug in a few minutes. It is independent of build-apk.yml.
#
# MANUAL ONLY (Actions tab -> Engine smoke test -> Run workflow): it is deliberately not triggered by pushes, so it can never run
# at the same time as the APK build. Run it after you edit anything under lfm25/app/src/main/cpp.
#
# Run it locally:  pip install gguf numpy && bash lfm25/tools/engine-smoke-test/run.sh

on:
  workflow_dispatch:      # manual only: Actions tab -> Engine smoke test -> Run workflow

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5      # only for the jni.h header; no JVM is started
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the engine and run the smoke test
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet gguf numpy
          bash lfm25/tools/engine-smoke-test/run.sh
